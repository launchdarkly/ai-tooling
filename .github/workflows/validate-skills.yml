name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SKILL.md files
        run: python3 scripts/validate_skills.py
      - name: Run validation tests
        run: python3 -m unittest discover -s tests
      - name: Check skills.json catalog
        run: python3 scripts/generate_catalog.py --check

  directory-checks:
    name: Claude plugin directory checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Unpinned on purpose: this job exists to match the portal's Validate,
      # which tracks the latest rules. If a CLI release regresses, this job
      # fails alone and can be made non-required until a fix ships.
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@latest
      - name: Validate plugin with the directory profile
        run: |
          claude --version
          claude plugin validate . --profile directory --strict
      # Runs even when the CLI step fails, so one run reports both.
      - name: Check directory policy gaps
        if: ${{ !cancelled() }}
        run: |
          python3 --version
          python3 scripts/check_directory_policy.py
