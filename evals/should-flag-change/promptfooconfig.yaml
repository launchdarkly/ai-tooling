# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Run with shared defaults:
#   promptfoo eval -c shared/defaults.yaml -c should-flag-change/promptfooconfig.yaml
#
# The should-flag-change skill is an ADVISORY, READ-ONLY skill. Given a code
# change (a <git_diff> block, optionally plus surrounding source), it decides
# whether the change should ship behind a LaunchDarkly feature flag and ends by
# calling the `recommend-flag` tool with { recommend, verdict, confidence, reasons }.
# `verdict` is the finer taxonomy signal — suggested / reuse-existing / already-flagged /
# not-suited — and the `verdict_taxonomy` assertions below check that reuse-existing (gate
# behind an existing flag that already covers this feature) and already-flagged (protected
# by an existing/ancestor gate) stay distinct from not-suited (nothing to flag).
# It must NEVER create, toggle, or modify a flag.
#
# Two-tier evaluation, expressed as two labeled providers. Each fixture targets
# exactly one tier via `providers: [<label>]`:
#
#   judgment  - allow_builtins: false. The agent gets the diff inline plus
#               snippets in <codebase_context> and must reach a verdict from
#               reasoning alone (no file exploration). Tests the call itself.
#   agentic   - allow_builtins: true. The agent gets the diff plus a scaffolded
#               repo (mock_files) and real Read/Grep/Glob, and must retrieve the
#               surrounding code before deciding. Tests explore-then-decide.
#
# Both tiers keep the LaunchDarkly MCP mocks exposed (default), so the flag-
# mutating tools are available and the "stayed advisory" assertion is real.
description: "End-to-end evaluation of the should-flag-change skill"

prompts:
  - file://../../skills/feature-flags/should-flag-change/SKILL.md

providers:
  - id: file://../providers/claude-skill-agent-sdk.js
    label: judgment
    config:
      skill_slug: should-flag-change
      allow_builtins: false
  - id: file://../providers/claude-skill-agent-sdk.js
    label: agentic
    config:
      skill_slug: should-flag-change
      allow_builtins: true

# Suite-wide contract checks applied to every fixture (concatenated with the
# shared defaults). These enforce the skill's two hard invariants directly,
# rather than leaving them to per-fixture verdict checks:
#   verdict_contract - recommend-flag is called EXACTLY once and as the final
#                      tool call (nothing after it). A run that calls it early,
#                      twice, or keeps working afterward fails.
#   read_only_guard  - the advisory skill must never modify state: no Edit/Write
#                      and no mutating shell command (redirects, rm/mv/cp, git
#                      commit/push, package installs, etc.). Meaningful in the
#                      agentic tier where built-in tools are exposed.
defaultTest:
  assert:
    - type: javascript
      value: |
        const traj = output.trajectory || [];
        const idxs = traj.map((t, i) => (t.tool === 'recommend-flag' ? i : -1)).filter(i => i >= 0);
        if (idxs.length !== 1) return { pass: false, score: 0, reason: `recommend-flag called ${idxs.length}x (must be exactly once)` };
        const after = traj.slice(idxs[0] + 1).map(t => t.tool);
        const pass = after.length === 0;
        return { pass, score: pass ? 1 : 0, reason: pass ? 'exactly one call, as the final step' : `tool calls after verdict: ${after.join(', ')}` };
      metric: verdict_contract
      weight: 2
    - type: javascript
      value: |
        const traj = output.trajectory || [];
        const tools = output.tools_called || [];
        const bannedTools = ['Edit', 'Write', 'MultiEdit', 'NotebookEdit'];
        const wrote = tools.filter(t => bannedTools.includes(t));
        // Mutating commands, plus a file-write redirect. The redirect arm uses a
        // negative lookbehind so it does NOT match `=>`/`->` (arrow syntax an
        // agent commonly greps for) or `2>&1`, and requires a real path-like
        // target after `>` so quoted `>` inside a search pattern is ignored.
        const mutRe = /(^|[;&|]|\s)(rm|mv|cp|sed\s+-i|tee|truncate|chmod|chown|mkdir|touch|git\s+(commit|push|add|checkout|apply|restore)|npm\s+(install|i|ci)|yarn\s+add|pnpm\s+(add|install))\b|(?<![=<>\-2])>>?\s*['"]?[\w./~]/;
        const badBash = traj.filter(t => t.tool === 'Bash' && mutRe.test(((t.arguments || {}).command) || ''));
        const pass = wrote.length === 0 && badBash.length === 0;
        const detail = [...wrote, ...badBash.map(t => 'Bash:' + (((t.arguments || {}).command) || '').slice(0, 50))];
        return { pass, score: pass ? 1 : 0, reason: pass ? 'read-only: no writes or mutating shell' : 'modified state via: ' + detail.join(' | ') };
      metric: read_only_guard
      weight: 2

tests:
  # ==================================================================
  # POSITIVE 1 (agentic) — new user-facing path
  # A new public export endpoint is added with no flag gate, while a
  # sibling route already gates its feature behind LaunchDarkly. The
  # agent should explore, notice the convention + the ungated new path,
  # and recommend a flag.
  # ==================================================================
  - description: "Positive/new user-facing path: recommends a flag for a new ungated public endpoint"
    providers: ["agentic"]
    vars:
      user_request: >
        This PR is up for review. Should the change be behind a LaunchDarkly
        feature flag? Read the diff and the surrounding code, then give your
        recommendation.
      git_diff: |
        diff --git a/src/app.js b/src/app.js
        index 3a1f00c..b2c9d41 100644
        --- a/src/app.js
        +++ b/src/app.js
        @@ -6,6 +6,7 @@ const app = express();
         app.use('/reports', require('./routes/reports'));
        +app.use('/export', require('./routes/export'));
         module.exports = app;
        diff --git a/src/routes/export.js b/src/routes/export.js
        new file mode 100644
        index 0000000..7de4a11
        --- /dev/null
        +++ b/src/routes/export.js
        @@ -0,0 +1,14 @@
        +const express = require('express');
        +const router = express.Router();
        +const { buildExport } = require('../services/exporter');
        +
        +// POST /export — new public endpoint: export the account's data as CSV.
        +router.post('/', async (req, res) => {
        +  const file = await buildExport(req.user, req.body.format || 'csv');
        +  res.setHeader('Content-Type', 'text/csv');
        +  res.send(file);
        +});
        +
        +module.exports = router;
      mock_files:
        "package.json": |
          {
            "name": "acme-api",
            "dependencies": {
              "express": "^4.18.0",
              "@launchdarkly/node-server-sdk": "^9.4.0"
            }
          }
        "src/app.js": |
          const express = require('express');
          const app = express();
          app.use(express.json());
          app.use('/reports', require('./routes/reports'));
          app.use('/export', require('./routes/export'));
          module.exports = app;
        "src/ld.js": |
          const ld = require('@launchdarkly/node-server-sdk');
          const client = ld.init(process.env.LD_SDK_KEY);
          // Convention: gate new features behind a boolean flag before exposing them.
          async function isEnabled(key, user, fallback = false) {
            return client.boolVariation(key, { kind: 'user', key: user }, fallback);
          }
          module.exports = { client, isEnabled };
        "src/routes/reports.js": |
          const express = require('express');
          const router = express.Router();
          const { isEnabled } = require('../ld');
          const { buildReport } = require('../services/reporter');

          // Existing feature — released gradually behind the 'reports-v2' flag.
          router.get('/', async (req, res) => {
            if (!(await isEnabled('reports-v2', req.user))) {
              return res.status(404).end();
            }
            res.json(await buildReport(req.user));
          });

          module.exports = router;
        "src/routes/export.js": |
          const express = require('express');
          const router = express.Router();
          const { buildExport } = require('../services/exporter');

          // POST /export — new public endpoint: export the account's data as CSV.
          router.post('/', async (req, res) => {
            const file = await buildExport(req.user, req.body.format || 'csv');
            res.setHeader('Content-Type', 'text/csv');
            res.send(file);
          });

          module.exports = router;
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          if (!call) return { pass: false, score: 0, reason: 'No recommend-flag verdict emitted' };
          const a = call.arguments || {};
          const pass = a.recommend === true;
          return { pass, score: pass ? 1 : 0, reason: `recommend=${a.recommend} confidence=${a.confidence}` };
        metric: verdict_match
        weight: 4

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const vIdx = traj.findIndex(t => t.tool === 'recommend-flag');
          const scope = traj.slice(0, vIdx < 0 ? traj.length : vIdx);
          const reads = scope.filter(t => ['Read','Grep','Glob'].includes(t.tool));
          const pass = reads.length > 0;
          return { pass, score: pass ? 1 : 0, reason: `explore calls before verdict: ${reads.length}` };
        metric: explored_before_deciding
        weight: 2

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'stayed advisory' : 'called mutating tools: ' + called.join(', ') };
        metric: stayed_advisory
        weight: 2

      - type: llm-rubric
        value: |
          The change adds a brand-new public POST /export endpoint. A sibling route
          (reports) already gates its feature behind a LaunchDarkly boolean flag, so
          the codebase convention is to flag new user-facing features.
          Evaluate the agent's recommendation:
          1. Did it recommend putting the change behind a flag (recommend: true)?
          2. Do its reasons cite specific evidence — the new /export endpoint and/or
             the existing flag convention it found in the code?
          3. Did it avoid creating or modifying any flag (advisory only)?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 2

  # ==================================================================
  # POSITIVE 2 (judgment) — risky behavior change on a live path
  # Auth middleware, applied to every route, is loosened to accept
  # tokens up to 24h after expiry. High blast radius, security-relevant.
  # Judged from the diff + context alone (no exploration).
  # ==================================================================
  - description: "Positive/risky behavior change: recommends a flag for a security-relevant auth change"
    providers: ["judgment"]
    vars:
      user_request: >
        Should this change be behind a feature flag?
      codebase_context: >
        Node.js Express API. src/middleware/auth.js exports requireAuth, which is
        applied globally in src/app.js via app.use(requireAuth) — every route
        depends on it. verifyJwt validates the token signature and returns claims.
      git_diff: |
        diff --git a/src/middleware/auth.js b/src/middleware/auth.js
        index 1a2b3c4..5d6e7f8 100644
        --- a/src/middleware/auth.js
        +++ b/src/middleware/auth.js
        @@ -12,9 +12,13 @@ function requireAuth(req, res, next) {
           const token = parseBearer(req.headers.authorization);
           if (!token) return res.status(401).json({ error: 'missing token' });

        -  const claims = verifyJwt(token);
        -  if (!claims || claims.exp < now()) {
        -    return res.status(401).json({ error: 'invalid or expired token' });
        -  }
        +  const claims = verifyJwt(token);
        +  if (!claims) {
        +    return res.status(401).json({ error: 'invalid token' });
        +  }
        +  // Reduce logout churn: allow a 24h grace period after token expiry.
        +  if (claims.exp < now() - 24 * 3600) {
        +    return res.status(401).json({ error: 'expired token' });
        +  }
           req.user = claims.sub;
           next();
         }
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          if (!call) return { pass: false, score: 0, reason: 'No recommend-flag verdict emitted' };
          const a = call.arguments || {};
          const pass = a.recommend === true;
          return { pass, score: pass ? 1 : 0, reason: `recommend=${a.recommend} confidence=${a.confidence}` };
        metric: verdict_match
        weight: 4

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'stayed advisory' : 'called mutating tools: ' + called.join(', ') };
        metric: stayed_advisory
        weight: 2

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          const a = (call && call.arguments) || {};
          const pass = a.risk === 'high';
          return { pass, score: pass ? 1 : 0, reason: `risk=${a.risk} (expected high: auth change on every route)` };
        metric: risk_calibrated
        weight: 1

      - type: llm-rubric
        value: |
          The change loosens JWT auth in middleware applied to every route: expired
          tokens are now accepted for 24h after expiry. This is a security-relevant
          behavior change on a live, high-blast-radius path.
          Evaluate the agent's recommendation:
          1. Did it recommend putting the change behind a flag (recommend: true)?
          2. Do its reasons cite the specific risk — the auth/token change and its
             blast radius (applies to every route)?
          3. Did it avoid creating or modifying any flag (advisory only)?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 2

  # ==================================================================
  # NEGATIVE 1 (agentic) — pure refactor, no behavior change
  # Inline currency formatting is extracted into a helper. The agent
  # should read the helper + caller, confirm behavior is preserved,
  # and recommend against a flag.
  # ==================================================================
  - description: "Negative/pure refactor: recommends against a flag for a behavior-preserving extraction"
    providers: ["agentic"]
    vars:
      user_request: >
        Should this change go behind a feature flag? Read the diff and the code
