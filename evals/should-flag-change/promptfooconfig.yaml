            return name + ': ' + formatCurrency(cents);
          }
          module.exports = { lineItem };
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          if (!call) return { pass: false, score: 0, reason: 'No recommend-flag verdict emitted' };
          const a = call.arguments || {};
          const pass = a.recommend === false;
          return { pass, score: pass ? 1 : 0, reason: `recommend=${a.recommend} confidence=${a.confidence}` };
        metric: verdict_match
        weight: 3

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const vIdx = traj.findIndex(t => t.tool === 'recommend-flag');
          const scope = traj.slice(0, vIdx < 0 ? traj.length : vIdx);
          const reads = scope.filter(t => ['Read','Grep','Glob'].includes(t.tool));
          const pass = reads.length > 0;
          return { pass, score: pass ? 1 : 0, reason: `explore calls before verdict: ${reads.length}` };
        metric: explored_before_deciding
        weight: 2

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'stayed advisory' : 'called mutating tools: ' + called.join(', ') };
        metric: stayed_advisory
        weight: 2

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          const a = (call && call.arguments) || {};
          const pass = a.verdict === 'not-suited';
          return { pass, score: pass ? 1 : 0, reason: `verdict=${a.verdict} (expected not-suited: pure refactor)` };
        metric: verdict_taxonomy
        weight: 2

      - type: llm-rubric
        value: |
          The change extracts inline currency formatting into a formatCurrency helper
          and calls it from lineItem. The output is identical — a pure, behavior-
          preserving refactor.
          Evaluate the agent's recommendation:
          1. Did it recommend AGAINST a flag (recommend: false)?
          2. Do its reasons show it recognized the change preserves behavior (no
             runtime behavior change / pure refactor)?
          3. Did it avoid creating or modifying any flag (advisory only)?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 2

  # ==================================================================
  # NEGATIVE 2 (judgment) — docs + tests only
  # A README update plus a new unit test. No shipped runtime behavior.
  # ==================================================================
  - description: "Negative/docs+tests: recommends against a flag for a docs and test-only change"
    providers: ["judgment"]
    vars:
      user_request: >
        Should this be behind a feature flag?
      codebase_context: >
        Small TypeScript library. README.md is user documentation; src/slug.ts is
        an existing pure function; tests live under test/.
      git_diff: |
        diff --git a/README.md b/README.md
        index 2b1a0c9..7f6e5d4 100644
        --- a/README.md
        +++ b/README.md
        @@ -10,6 +10,10 @@ npm install @acme/slug
         ## Usage

         ```ts
         import { slugify } from '@acme/slug';
        +slugify('Hello World'); // 'hello-world'
         ```
        +
        +## Contributing
        +Run `npm test` before opening a PR.
        diff --git a/test/slug.test.ts b/test/slug.test.ts
        index 3c2b1a0..9d8e7f6 100644
        --- a/test/slug.test.ts
        +++ b/test/slug.test.ts
        @@ -5,3 +5,7 @@ test('lowercases and hyphenates', () => {
           expect(slugify('Hello World')).toBe('hello-world');
         });
        +
        +test('collapses repeated separators', () => {
        +  expect(slugify('a  --  b')).toBe('a-b');
        +});
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          if (!call) return { pass: false, score: 0, reason: 'No recommend-flag verdict emitted' };
          const a = call.arguments || {};
          const pass = a.recommend === false;
          return { pass, score: pass ? 1 : 0, reason: `recommend=${a.recommend} confidence=${a.confidence}` };
        metric: verdict_match
        weight: 3

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'stayed advisory' : 'called mutating tools: ' + called.join(', ') };
        metric: stayed_advisory
        weight: 2

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
          const a = (call && call.arguments) || {};
          const pass = a.risk === undefined || a.risk === 'low';
          return { pass, score: pass ? 1 : 0, reason: `risk=${a.risk} (expected low or absent: docs/test-only)` };
        metric: risk_calibrated
        weight: 1

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const call = traj.find(t => t.tool === 'recommend-flag');
