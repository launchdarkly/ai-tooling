        -}
        +const { formatCurrency } = require('./format');
        +function lineItem(name, cents) {
        +  return name + ': ' + formatCurrency(cents);
        +}
         module.exports = { lineItem };
      mock_files:
        "package.json": |
          { "name": "acme-billing", "dependencies": {} }
        "src/format.js": |
          // Extracted from pricing.js with no change in behavior.
          function formatCurrency(cents) {
