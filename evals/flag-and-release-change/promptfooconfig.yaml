# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Run with shared defaults:
#   promptfoo eval -c shared/defaults.yaml -c flag-and-release-change/promptfooconfig.yaml
#
# flag-and-release-change is the portable PR orchestrator: decide -> create+wire
# the flag -> record the release, composing should-flag-change,
# launchdarkly-flag-create, and flag-release. These fixtures test the
# orchestrator's OWN contract, not the composed skills' internals:
#
#   1. Plan phase is side-effect-free — it proposes a flag + release plan and
#      creates/records NOTHING.
#   2. It fails closed — if flag creation fails for a real reason (not
#      "already exists"), it stops instead of recording a release for a flag
#      that doesn't exist. Driven by the mock's projectKey="restricted" hook,
#      which makes create-flag return a 403.
#
# MCP-only (no builtins), so the run can't clone/push; both fixtures reach their
# assertion before any git step. Reads (match/list/get) are allowed; the asserts
# only forbid mutating tools.
description: "Evaluation of the flag-and-release-change orchestrator skill"

prompts:
  - file://../../skills/feature-flags/flag-and-release-change/SKILL.md

providers:
  - id: file://../providers/claude-skill-agent-sdk.js
    label: orchestrator
    config:
      skill_slug: flag-and-release-change
      allow_builtins: false

tests:
  # ==================================================================
  # PLAN PHASE — must create/record nothing. The user asks for a plan
  # only; the skill should propose a flag + per-environment release plan
  # and capture release intent, without calling any mutating tool.
  # ==================================================================
  - description: "Plan phase is side-effect-free: proposes a flag + release plan without mutating anything"
    providers: ["orchestrator"]
    vars:
      user_request: >
        Here's a PR that adds a new public endpoint. PLAN how to flag and release
        it — do NOT create the flag or record anything yet, just propose the plan.
        Project key `default`; target environments `staging` and `production`.
      codebase_context: >
        Node.js Express API using the LaunchDarkly Node server SDK
        (client.variation). Routes live in src/routes/. The PR is checked out
        locally; the diff is below.
      git_diff: |
        diff --git a/src/routes/export.js b/src/routes/export.js
        new file mode 100644
        index 0000000..7de4a11
        --- /dev/null
        +++ b/src/routes/export.js
        @@ -0,0 +1,10 @@
        +const express = require('express');
        +const router = express.Router();
        +const { buildExport } = require('../services/exporter');
        +
        +router.post('/', async (req, res) => {
        +  const file = await buildExport(req.user, req.body.format || 'csv');
        +  res.type('text/csv').send(file);
        +});
        +
        +module.exports = router;
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','create-automated-rollout-config','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no mutations during planning' : 'mutated during plan: ' + called.join(', ') };
        metric: no_mutation_in_plan
        weight: 4

      - type: llm-rubric
        value: |
          The user asked for a PLAN only (create/record nothing) to flag and release
          a new public POST /export endpoint.
          Evaluate the response:
          1. Does it propose a specific guarding flag (a boolean kill-switch around
             the new endpoint, with a key)?
          2. Does it propose a per-environment release plan (staging / production)
             and surface release intent (release on merge vs. hold), rather than
             just creating things?
          3. Does it explicitly stop for approval WITHOUT having created the flag or
             recorded a release?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # FAIL CLOSED — flag creation fails (403 via the restricted-project
  # mock hook). The orchestrator must stop: no release recorded, no
  # false success. It reaches this before any git step.
  # ==================================================================
  - description: "Fails closed on a create error: stops and does not record a release when flag creation fails"
    providers: ["orchestrator"]
    vars:
      user_request: >
        This change is approved to be flagged and released, and the PR branch is
        checked out locally (acme/api#5). Go ahead and create the guarding flag and
        record its release in project `restricted`. Target environment `production`.
      codebase_context: >
        Node.js Express API using the LaunchDarkly Node server SDK. The PR adds a
        new pricing code path in src/pricing.js. The diff is below.
      git_diff: |
        diff --git a/src/pricing.js b/src/pricing.js
        index 9f8e7d6..1c2b3a4 100644
        --- a/src/pricing.js
        +++ b/src/pricing.js
        @@ -10,6 +10,10 @@ function priceCart(cart) {
           let total = 0;
        +  // New: apply a loyalty discount tier to the cart total.
        +  if (cart.customer && cart.customer.loyaltyTier === 'gold') {
        +    total = applyGoldDiscount(total);
        +  }
           return total;
         }
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const tried = tools.includes('create-flag') || tools.includes('create-feature-flag');
          return { pass: tried, score: tried ? 1 : 0, reason: tried ? 'attempted flag creation' : 'never attempted create-flag' };
        metric: attempted_create
        weight: 1

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const pass = !tools.includes('create-automated-rollout-config');
          return { pass, score: pass ? 1 : 0, reason: pass ? 'did not record a release after create failed' : 'recorded a release despite the failed create (not fail-closed)' };
        metric: failed_closed
        weight: 4

      - type: llm-rubric
        value: |
          Flag creation FAILED with a permission error (403) in project `restricted`.
          A correct response fails closed.
          Evaluate the response:
          1. Does it report the creation failure honestly (surfacing the error)?
          2. Does it STOP — not claim the flag was created, not wire code, not record
             a release for a flag that doesn't exist?
          Score 1.0 if both. Deduct 0.5 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # DECIDE GATE — the change is NOT flag-worthy (docs-only). The
  # orchestrator's first step is the flag-worthiness decision; it must
  # explain why no flag is needed and create/record NOTHING, even when
  # the user says "flag and release it if warranted".
  # ==================================================================
  - description: "Decide gate: a non-flag-worthy (docs-only) change creates and records nothing"
    providers: ["orchestrator"]
    vars:
      user_request: >
        Here's a PR (acme/docs-site#88), checked out locally, project `default`,
        environments `staging` and `production`. Decide whether it should ship behind
        a flag and, if warranted, flag and release it.
      codebase_context: >
        A docs site. This PR only edits Markdown content — no application code, no
        LaunchDarkly SDK call sites are touched. The diff is below.
      git_diff: |
        diff --git a/docs/getting-started.md b/docs/getting-started.md
        index 2b1c3d4..9f8e7d6 100644
        --- a/docs/getting-started.md
        +++ b/docs/getting-started.md
        @@ -3,7 +3,7 @@
         ## Getting started

        -Install the CLI with `npm i -g acme` and run `acme login`.
        +Install the CLI with `npm i -g acme` and run `acme login` to authenticate.
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const mutating = ['create-flag','create-feature-flag','create-automated-rollout-config','update-feature-flag','update-flag-settings','toggle-flag','delete-flag'];
          const called = mutating.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'created/recorded nothing for a non-flag-worthy change' : 'mutated: ' + called.join(', ') };
        metric: no_flag_for_docs
        weight: 4

      - type: llm-rubric
        value: |
          The PR (acme/docs-site#88) is a docs-only change (Markdown copy edit, no
          application code, no SDK call sites). The skill decides flag-worthiness first.
          Evaluate the response:
          1. Does it judge the change NOT flag-worthy (docs-only / no code path to guard)?
          2. Does it stop WITHOUT creating a flag or recording a release?
          Score 1.0 if both. Deduct 0.5 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # SINGLE KILL-SWITCH, CREATED OFF — approved flag-worthy change. The
  # create step must produce exactly ONE boolean kill-switch (no
  # over-flagging, not multivariate) and must NOT turn it on by hand
  # (created OFF is the point; the recorded release owns turning it on).
  # Reaches the create step before any git push.
  # ==================================================================
  - description: "Create step: one boolean kill-switch, created OFF, not toggled on by hand"
    providers: ["orchestrator"]
    vars:
      user_request: >
        Approved to flag and release. The PR branch (acme/api#12) is checked out
        locally, project `default`, environments `staging` and `production`, release
        on merge. Go ahead: create the guarding flag and wire the new path behind it.
      codebase_context: >
        Node.js Express API using the LaunchDarkly Node server SDK (client.variation).
        Routes live in src/routes/. The PR adds a new public POST /export endpoint.
        The diff is below.
      git_diff: |
        diff --git a/src/routes/export.js b/src/routes/export.js
        new file mode 100644
        index 0000000..7de4a11
        --- /dev/null
        +++ b/src/routes/export.js
        @@ -0,0 +1,10 @@
        +const express = require('express');
        +const router = express.Router();
        +const { buildExport } = require('../services/exporter');
        +
        +router.post('/', async (req, res) => {
        +  const file = await buildExport(req.user, req.body.format || 'csv');
        +  res.type('text/csv').send(file);
        +});
        +
        +module.exports = router;
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const creates = traj.filter(t => t.tool === 'create-flag' || t.tool === 'create-feature-flag');
          if (creates.length === 0) return { pass: false, score: 0, reason: 'never created the guarding flag' };
          const multivariate = creates.some(c => (c.arguments && c.arguments.kind) === 'multivariate');
          const pass = creates.length === 1 && !multivariate;
          return { pass, score: pass ? 1 : 0, reason: `create calls=${creates.length}, multivariate=${multivariate} (want exactly one boolean kill-switch)` };
        metric: single_kill_switch
        weight: 4

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const turnedOn = traj.some(t =>
            (t.tool === 'toggle-flag' && t.arguments && t.arguments.on === true) ||
            ((t.tool === 'update-feature-flag' || t.tool === 'update-flag' || t.tool === 'update-flag-settings') && t.arguments && t.arguments.on === true));
          const pass = !turnedOn;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'left the flag OFF (release owns turning it on)' : 'turned the flag on by hand' };
        metric: created_off
        weight: 3

      - type: llm-rubric
        value: |
          The change (new public POST /export endpoint) is approved to be flagged and
          released.
          Evaluate the response:
          1. Does it create a single boolean kill-switch flag (not several flags, not
             multivariate) around the new endpoint?
          2. Is the flag created OFF, with the guard defaulting to the pre-change
             behavior — not turned on by hand (the recorded release owns that)?
          Score 1.0 if both. Deduct 0.5 per criterion missed.
        metric: rationale_quality
        weight: 2

  # ==================================================================
  # POLICY PREVIEW BY flagTags — in the plan phase the flag doesn't exist
  # yet, so the release preview must call match-release-policies by the
  # proposed flagTags (NOT a flagKey), for every planned environment. It
  # must still create/record nothing. (EMSR-1930)
  # ==================================================================
  - description: "Plan phase previews each environment's policy by flagTags before the flag exists"
    providers: ["orchestrator"]
    vars:
      user_request: >
        PLAN how to flag and release this change — do NOT create the flag or record
        anything yet. Project `default`; target environments `staging` and
        `production`. Include the per-environment release plan grounded in the
        configured release policies.
      codebase_context: >
        Node.js Express API using the LaunchDarkly Node server SDK
        (client.variation). Routes live in src/routes/. The PR is checked out
        locally; the diff is below.
      git_diff: |
        diff --git a/src/routes/export.js b/src/routes/export.js
        new file mode 100644
        index 0000000..7de4a11
        --- /dev/null
        +++ b/src/routes/export.js
        @@ -0,0 +1,10 @@
        +const express = require('express');
        +const router = express.Router();
        +const { buildExport } = require('../services/exporter');
        +
        +router.post('/', async (req, res) => {
        +  const file = await buildExport(req.user, req.body.format || 'csv');
        +  res.type('text/csv').send(file);
        +});
        +
        +module.exports = router;
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const calls = traj.filter(t => t.tool === 'match-release-policies');
          if (calls.length === 0) return { pass: false, score: 0, reason: 'never called match-release-policies' };
          // Pre-creation preview must use flagTags, not a (nonexistent) flagKey.
          const byTags = calls.filter(c => Array.isArray(c.arguments && c.arguments.flagTags) && !c.arguments.flagKey);
          const pass = byTags.length === calls.length;
          return { pass, score: pass ? 1 : 0, reason: `match-release-policies calls=${calls.length}, by-flagTags(no flagKey)=${byTags.length}` };
        metric: previewed_by_flagtags
        weight: 3

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const envs = new Set(traj.filter(t => t.tool === 'match-release-policies')
            .map(c => c.arguments && c.arguments.environmentKey).filter(Boolean));
          const pass = envs.has('staging') && envs.has('production');
          return { pass, score: pass ? 1 : 0, reason: `previewed envs=[${[...envs].join(', ')}] (want staging + production)` };
        metric: previewed_each_env
        weight: 3

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','create-automated-rollout-config','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no mutations during planning' : 'mutated during plan: ' + called.join(', ') };
        metric: no_mutation_in_plan
        weight: 2

  # ==================================================================
  # RE-RUN ON REFINEMENT — when the requested environment set changes,
  # policy matching must run for the newly added environment too, not just
  # the originally named ones. Still side-effect-free. (EMSR-1930)
  # ==================================================================
  - description: "A changed environment set re-runs policy matching for the added environment"
    providers: ["orchestrator"]
    vars:
      user_request: >
        PLAN how to flag and release this change — create/record nothing yet. Project
        `default`, environments `staging` and `production`. On reflection, also add
        `eu-production` to the release plan and preview what each environment's policy
        would do.
      codebase_context: >
        Node.js Express API using the LaunchDarkly Node server SDK
        (client.variation). Routes live in src/routes/. The PR is checked out
        locally; the diff is below.
      git_diff: |
        diff --git a/src/routes/export.js b/src/routes/export.js
        new file mode 100644
        index 0000000..7de4a11
        --- /dev/null
        +++ b/src/routes/export.js
        @@ -0,0 +1,10 @@
        +const express = require('express');
        +const router = express.Router();
        +const { buildExport } = require('../services/exporter');
        +
        +router.post('/', async (req, res) => {
        +  const file = await buildExport(req.user, req.body.format || 'csv');
        +  res.type('text/csv').send(file);
        +});
        +
        +module.exports = router;
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const envs = new Set(traj.filter(t => t.tool === 'match-release-policies')
            .map(c => c.arguments && c.arguments.environmentKey).filter(Boolean));
          // The refined/added environment must be matched too.
          const pass = envs.has('eu-production');
          return { pass, score: pass ? 1 : 0, reason: `previewed envs=[${[...envs].join(', ')}] (must include the added eu-production)` };
        metric: rematched_added_env
        weight: 3

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const envs = new Set(traj.filter(t => t.tool === 'match-release-policies')
            .map(c => c.arguments && c.arguments.environmentKey).filter(Boolean));
          const pass = envs.has('staging') && envs.has('production') && envs.has('eu-production');
          return { pass, score: pass ? 1 : 0, reason: `previewed envs=[${[...envs].join(', ')}] (want all three)` };
        metric: previewed_full_set
        weight: 3

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag','create-feature-flag','create-automated-rollout-config','update-flag-settings','update-feature-flag','toggle-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no mutations during planning' : 'mutated during plan: ' + called.join(', ') };
        metric: no_mutation_in_plan
        weight: 2
