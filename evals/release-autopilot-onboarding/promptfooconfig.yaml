    vars:
      user_request: "Set up Release Autopilot auto-flagging and auto-releasing for acme/demo in project default, production only."
      max_turns: 24
      mock_overrides:
        get-environment-release-plans:
          items:
            - key: fast
              name: Fast
              environmentKey: production
              default: true
              progressiveRelease:
                randomizationUnit: user
                advancementMode: automatic
                cleanupBehavior: remove_rules_and_update_default_rule
                phases:
                  - clauses: [{ attribute: kind, op: in, values: ["user"], contextKind: user }]
                    steps: [{ allocation: 50000, durationMillis: 3600000 }]
                metrics: {}
            - key: gradual
              name: Gradual
              environmentKey: production
              default: false
              progressiveRelease:
                randomizationUnit: user
                advancementMode: automatic
                cleanupBehavior: remove_rules_and_update_default_rule
                phases:
                  - clauses: [{ attribute: kind, op: in, values: ["user"], contextKind: user }]
                    steps: [{ allocation: 10000, durationMillis: 14400000 }, { allocation: 50000, durationMillis: 14400000 }]
                metrics: {}
          totalCount: 2
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging", "Auto-releasing"]
        - ["LaunchDarkly's"]
        - ["Production"]
        - ["Choose another"]
        - ["Gradual"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:existingPlanSetAsDefault
        metric: existing_plan_default
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:saysReplacesDefault
        metric: says_replaces_default
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmsBeforeWriting
        metric: confirms_before_writing
        weight: 3

  # ------------------------------------------------------------------
  # The GitHub App install cannot be read (reposError) on every read. The
  # wizard reads once more, then pauses before repo mapping: no writes.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Install unreadable: pause before mapping, no writes"
    vars:
      user_request: "Set up Release Autopilot auto-flagging for acme/demo in project default."
      max_turns: 14
      mock_overrides:
        get-automations:
          account: { autoFlagging: { enabled: true, approvalRequired: true }, autoReleasing: { enabled: true }, version: 9 }
          repos:
            - { githubRepoId: 101, mapped: true, projectKey: default, autoFlagging: { enabled: true, approvalRequired: true, enabledOverride: false }, autoReleasing: { enabled: true, enabledOverride: false } }
          totalCount: 1
          hasMore: false
          reposError: "The GitHub App install could not be read, so repos lists only mapped repositories, without names. Retry later."
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:pausesOnReposError
        metric: pauses_on_repos_error
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noWrites
        metric: no_writes
        weight: 3

