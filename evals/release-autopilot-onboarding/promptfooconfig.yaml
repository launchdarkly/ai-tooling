      max_turns: 18
      mock_overrides:
        get-release-autopilot-settings:
          autoFlagging: { enabled: false, approvalRequired: false }
          autoReleasing: { enabled: false }
          version: 1
        list-release-autopilot-repo-settings: { repos: [], totalCount: 0 }
        list-release-autopilot-github-repos:
          installed: false
          userAuthorized: false
          repositories: []
          totalCount: 0
