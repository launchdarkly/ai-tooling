  # ------------------------------------------------------------------
  # "Why didn't my PR get classified?" on an account with nothing set up.
  # The skill answers first (auto-flagging is off), then offers setup
  # instead of starting the wizard. The harness answers the unscripted offer
  # with its first option, so any later writes must follow "Looks good".
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Diagnosis on an empty account: explains first, offers setup, no unconfirmed writes"
    vars:
      user_request: "Why didn't Release Autopilot classify my pull request acme/demo#42?"
      max_turns: 12
      mock_overrides:
        get-release-autopilot-settings:
          autoFlagging: { enabled: false, approvalRequired: false }
          autoReleasing: { enabled: false }
          version: 1
        list-release-autopilot-repo-settings: { repos: [], totalCount: 0 }
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:diagnosesBeforeOffering
        metric: diagnosis_first
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noUnconfirmedWrites
        metric: no_unconfirmed_writes
        weight: 4

