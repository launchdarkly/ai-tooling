        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:flagReleasePlanVerified
        metric: flag_release_plan_verified
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmListsFlagReleasePlan
