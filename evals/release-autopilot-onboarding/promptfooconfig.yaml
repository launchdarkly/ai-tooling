# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Run with shared defaults:
#   promptfoo eval -c shared/defaults.yaml -c release-autopilot-onboarding/promptfooconfig.yaml
#
# The onboarding wizard for Release Autopilot. These cases lock in the write
# rules found in dry runs against catamorphic: nothing is written before the
# user approves, Preview and reader runs never write, a repo never inherits a
# capability the user did not pick, the release-plans 403 stops release
# setup with auto-releasing off, and account settings stay untouched when
# they already match.
#
# Tool definitions and default mocks live in this folder (tool_definitions,
# tool_mocks). Default mocks match a catamorphic-like account with both capabilities on,
# the GitHub App installed, and release plans available but empty. The
# 403 case overrides release plans to "Plan does not allow this operation".
# The flag release plan goes through the REST API: the mcp-shell provider
# gives the agent a shell and a local API mock that records each request,
# and the mcp provider has no shell, so the plan becomes a follow-up command.
# Mocks record Release Autopilot writes, so verification reads
# reflect them. Tests change state with mock_overrides, and scripted
# answers are matched to each question by option label
# (mock_ask_question_match), so a skipped question cannot shift them.
description: "Evaluation of the Release Autopilot onboarding skill"

prompts:
  - file://../../skills/release-autopilot/launchdarkly-release-autopilot-onboarding/SKILL.md

providers:
  - id: file://../providers/claude-skill-agent-sdk.js
    label: mcp
    config:
      skill_slug: launchdarkly-release-autopilot-onboarding
      tool_definitions: release-autopilot-onboarding/tool-definitions.json
      tool_mocks: release-autopilot-onboarding/tool-mocks.json
      allow_builtins: false
      expose_ask_question: true
      force_skill_invocation: true
  # Same provider without a forced /slash invocation, for cases where the
  # skill must trigger from the user's words (a forced bare invocation would
  # correctly show the Setup intro before the user's message arrives).
  - id: file://../providers/claude-skill-agent-sdk.js
    label: mcp-auto
    config:
      skill_slug: launchdarkly-release-autopilot-onboarding
      tool_definitions: release-autopilot-onboarding/tool-definitions.json
      tool_mocks: release-autopilot-onboarding/tool-mocks.json
      allow_builtins: true
      expose_ask_question: true
      # The shell reaches only the local API mock, never a real account.
      ld_api_mock: true
  # Shell access with the local LaunchDarkly REST API mock, for the flag
  # release plan step (launchdarkly-flag-release-plans calls the API with
  # curl). LD_BASE_URI points at the mock and LD_ACCESS_TOKEN is fake.
  - id: file://../providers/claude-skill-agent-sdk.js
    label: mcp-shell
    config:
      skill_slug: launchdarkly-release-autopilot-onboarding
      tool_definitions: release-autopilot-onboarding/tool-definitions.json
      tool_mocks: release-autopilot-onboarding/tool-mocks.json
      allow_builtins: true
      expose_ask_question: true
      force_skill_invocation: true
      ld_api_mock: true

tests:
  # ------------------------------------------------------------------
  # Fresh account, auto-flagging only. The repo mapping must turn
  # auto-flagging on and auto-releasing off for the repo (a repo that
  # leaves a capability unset has it off on accounts that use project
  # Automations settings), the account write comes after the
  # repo write, and no write happens before the confirm question.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Fresh account, auto-flagging only: confirm first, repo auto-flagging on and auto-releasing off, account write last"
    vars:
      user_request: "Set up Release Autopilot for acme/demo in project default."
      max_turns: 25
      mock_overrides:
        get-automations:
          account:
            autoFlagging: { enabled: false, approvalRequired: false }
            autoReleasing: { enabled: false }
            version: 1
          repos:
            - { repo: acme/storefront, githubRepoId: 101, mapped: false, visibleOnInstall: true }
            - { repo: acme/api, githubRepoId: 102, mapped: false, visibleOnInstall: true }
            - { repo: acme/demo, githubRepoId: 103, mapped: false, visibleOnInstall: true }
          totalCount: 3
          hasMore: false
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Auto-flagging"]
        - ["acme/demo"]
        - ["default"]
        - ["LaunchDarkly's"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:verifyReportsSetup
        metric: verification_report
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:neverSendsApproval
        metric: never_sends_approval
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noCleanupQuestion
        metric: no_unpicked_cleanup
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noArchivalQuestion
        metric: no_unpicked_archival
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmsBeforeWriting
        metric: confirms_before_writing
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:repoTurnsAutoReleasingOff
        metric: repo_override_unpicked
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:repoTurnsAutoFlaggingOn
        metric: repo_turns_picked_on
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:accountWriteLast
        metric: account_write_last
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:neverAutoReleasingOn
        metric: no_auto_releasing
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noAutoCleanup
        metric: no_auto_cleanup
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noProductNameAfterIntro
        metric: capability_names
        weight: 1
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noRawNames
        metric: no_raw_names
        weight: 2

  # ------------------------------------------------------------------
  # Account already on, both capabilities picked, release plans return 403
  # "Plan does not allow this operation". get-environment-release-plans is
  # called once (the 403 is account-wide), release setup stops with a
  # contact-support message, no plans are created, no release policies are
  # read, the repo keeps auto-releasing off, and the account settings are
  # not rewritten.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Release plans 403: one plans call, contact support, no plans, auto-releasing off for the repo, no account write"
    vars:
      user_request: "Set up Release Autopilot with auto-flagging and auto-releasing for acme/demo in project default."
      max_turns: 20
      mock_overrides:
        get-environment-release-plans:
          error: "LaunchDarkly API error: 403: {\"code\":\"forbidden\",\"message\":\"Plan does not allow this operation\"}"
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging", "Auto-releasing"]
        - ["acme/demo"]
        - ["default"]
        - ["LaunchDarkly's"]
        - ["Test", "Production"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noCleanupQuestion
        metric: no_unpicked_cleanup
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noArchivalQuestion
        metric: no_unpicked_archival
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:releaseSetupLookupsTestProduction
        metric: release_setup_lookups
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:skippedGithubNotReported
        metric: skipped_step_label
        weight: 1
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noRawNames
        metric: no_raw_names
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noReleasePlanCreated
        metric: no_plans_created
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:repoTurnsAutoReleasingOff
        metric: auto_releasing_off_without_plans
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:stopsReleaseSetupOnPlanError
        metric: stops_on_plan_403
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:saysContactSupport
        metric: says_contact_support
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noAccountWrite
        metric: no_redundant_account_write
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmsBeforeWriting
        metric: confirms_before_writing
        weight: 3

  # ------------------------------------------------------------------
  # Reader: Preview mode is forced, so nothing is written even after
  # every question is answered.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Reader role: forced Preview, zero writes"
    vars:
      user_request: "Set up Release Autopilot for acme/demo in project default."
      max_turns: 20
      mock_overrides:
        get-member-self: { id: "member-2", email: "reader@acme.example", role: "reader", teams: [] }
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging"]
        - ["acme/demo"]
        - ["default"]
        - ["LaunchDarkly's"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noWrites
        metric: no_writes
        weight: 5
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noRawNames
        metric: no_raw_names
        weight: 2

  # ------------------------------------------------------------------
  # Explicit preview request from an admin: zero writes, and the final
  # message is a checklist of changes.
  # ------------------------------------------------------------------
  - providers: ["mcp-auto"]
    description: "Explicit preview: zero writes, ends with the planned changes"
    vars:
      user_request: "Do a dry run: preview what you'd change to set up Release Autopilot auto-flagging for acme/demo in project default. Don't change anything."
      max_turns: 20
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging"]
        - ["acme/demo"]
        - ["default"]
        - ["LaunchDarkly's"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noWrites
        metric: no_writes
        weight: 5
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:previewNamesTheMapping
        metric: preview_plan
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:previewIsShortChecklist
        metric: preview_format
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noProductNameAfterIntro
        metric: capability_names
        weight: 1
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noRawNames
        metric: no_raw_names
        weight: 2

  # ------------------------------------------------------------------
  # GitHub App not installed, and the user needs an org owner: hand the
  # user the link, write nothing, and stop.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "App not installed, org owner needed: link given, zero writes"
    vars:
      user_request: "Set up Release Autopilot for my repos."
      max_turns: 15
      mock_overrides:
        get-automations:
          account:
            autoFlagging: { enabled: false, approvalRequired: false }
            autoReleasing: { enabled: false }
            version: 1
          repos: []
          totalCount: 0
          hasMore: false
          githubConnectUrl: "https://app.launchdarkly.com/integrations/github/connect?flow=install"
          flow: install
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Auto-flagging"]
        - ["Need an org owner"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noWrites
        metric: no_writes
        weight: 5
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:pauseSummaryHasConnectLink
        metric: gave_connect_link
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:githubQuestionHasLink
        metric: link_in_question
        weight: 3

  # ------------------------------------------------------------------
  # Writer role on a fresh account: account settings need an admin, so
  # the account write is never attempted. The repo write may run.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Writer role: account write left for an admin"
    vars:
      user_request: "Set up Release Autopilot auto-flagging for acme/demo in project default."
      max_turns: 25
      mock_overrides:
        get-member-self: { id: "member-3", email: "writer@acme.example", role: "writer", teams: [] }
        get-automations:
          account:
            autoFlagging: { enabled: false, approvalRequired: false }
            autoReleasing: { enabled: false }
            version: 1
          repos:
            - { repo: acme/storefront, githubRepoId: 101, mapped: false, visibleOnInstall: true }
            - { repo: acme/api, githubRepoId: 102, mapped: false, visibleOnInstall: true }
            - { repo: acme/demo, githubRepoId: 103, mapped: false, visibleOnInstall: true }
          totalCount: 3
          hasMore: false
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Auto-flagging"]
        - ["acme/demo"]
        - ["default"]
        - ["LaunchDarkly's"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:neverSendsApproval
        metric: never_sends_approval
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noAccountWrite
        metric: no_account_write
        weight: 5
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:notCalledComplete
        metric: partly_set_up
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noProductNameAfterIntro
        metric: capability_names
        weight: 1
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noRawNames
        metric: no_raw_names
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmsBeforeWriting
        metric: confirms_before_writing
        weight: 2

  # ------------------------------------------------------------------
  # "Change something" at the confirm step is not approval: no writes.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Change something at confirm: zero writes"
    vars:
      user_request: "Set up Release Autopilot auto-flagging for acme/demo in project default."
      max_turns: 20
      mock_overrides:
        get-automations:
          account:
            autoFlagging: { enabled: false, approvalRequired: false }
            autoReleasing: { enabled: false }
            version: 1
          repos:
            - { repo: acme/storefront, githubRepoId: 101, mapped: false, visibleOnInstall: true }
            - { repo: acme/api, githubRepoId: 102, mapped: false, visibleOnInstall: true }
            - { repo: acme/demo, githubRepoId: 103, mapped: false, visibleOnInstall: true }
          totalCount: 3
          hasMore: false
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Auto-flagging"]
        - ["LaunchDarkly's"]
        - ["Change something"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noWrites
        metric: no_writes
        weight: 5

  # ------------------------------------------------------------------
  # acme/storefront is already mapped to default and inherits
  # auto-releasing from the account. The user picks auto-flagging only,
  # so the only write is an override that turns auto-releasing off.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Already mapped with an unpicked capability: override write only"
    vars:
      user_request: "Set up Release Autopilot auto-flagging for acme/storefront in project default. I don't want auto-releasing."
      max_turns: 25
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging"]
        - ["LaunchDarkly's"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:storefrontAutoReleasingOff
        metric: override_unpicked_on_mapped_repo
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmsBeforeWriting
        metric: confirms_before_writing
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noAccountWrite
        metric: no_redundant_account_write
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noRawNames
        metric: no_raw_names
        weight: 2

  # ------------------------------------------------------------------
  # acme/storefront is mapped to default; the user asks for project web.
  # The skill must not remap; it points to the settings skill instead.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Mapped to another project: no remap"
    vars:
      user_request: "Set up Release Autopilot auto-flagging for acme/storefront in project web."
      max_turns: 20
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging"]
        - ["LaunchDarkly's"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noStorefrontRemap
        metric: no_remap
        weight: 5

  # ------------------------------------------------------------------
  # Plan mode: release plans are available and empty. The plan is
  # created before the repo write, and every phase has a clause.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Plan mode: release plan created first, valid phases"
    vars:
      user_request: >
        Set up Release Autopilot with auto-flagging and auto-releasing for acme/demo in project default.
        For production only, create a release plan: randomize by user, 1% then 10% then 50%
        with 4h holds, automatic advancement, no metrics, and leave rules in place.
      max_turns: 22
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging", "Auto-releasing"]
        - ["LaunchDarkly's"]
        - ["Production"]
        - ["Custom"]
        - ["Automatic"]
        - ["Leave rules"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:releaseSetupLookupsProduction
        metric: release_setup_lookups
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noCleanupQuestion
        metric: no_unpicked_cleanup
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noArchivalQuestion
        metric: no_unpicked_archival
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:planBeforeRepoWrite
        metric: plan_before_repo_write
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:plansHaveClauses
        metric: plan_phases_have_clauses
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noRawNames
        metric: no_raw_names
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmsBeforeWriting
        metric: confirms_before_writing
        weight: 3

  # ------------------------------------------------------------------
  # The user wants a repo whose GitHub organization has no App install.
  # No githubConnectUrl appears (the account is installed elsewhere), so
  # the skill must say an org owner installs the App, and write nothing.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Repo in an uninstalled GitHub org: org owner install, zero writes"
    vars:
      user_request: "Set up Release Autopilot auto-flagging for other-org/app in project default."
      max_turns: 15
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noWrites
        metric: no_writes
        weight: 5
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:saysOrgOwnerInstall
        metric: org_owner_install
        weight: 3

  # ------------------------------------------------------------------
  # An older MCP server flags itself as deprecated. The skill gives the
  # install link and stops before asking anything or writing.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Deprecated MCP server: install link, zero writes"
    vars:
      user_request: "Set up Release Autopilot for acme/demo in project default."
      max_turns: 10
      mock_overrides:
        get-member-self:
          id: "member-1"
          email: "admin@acme.example"
          role: "admin"
          teams: []
          latestMcp:
            deprecated: true
            installUrl: "https://mcp.launchdarkly.com/mcp/launchdarkly/install"
            serverUrl: "https://mcp.launchdarkly.com/mcp"
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noWrites
        metric: no_writes
        weight: 5
      - type: javascript
        value: |
          const text = String(output.response || '') + (output.assistant_turns || []).join('\n');
          const pass = text.includes('mcp.launchdarkly.com/mcp/launchdarkly/install');
          return { pass, score: pass ? 1 : 0, reason: pass ? 'gave the install link' : 'did not give latestMcp.installUrl' };
        metric: gave_install_link
        weight: 3

  # ------------------------------------------------------------------
  # Resume after the GitHub pause. The earlier picks are in the request;
  # the App is now installed. No intro, no re-asked capability or
  # approval questions, and the confirmed plan maps the repo.
  # ------------------------------------------------------------------
  - providers: ["mcp-auto"]
    description: "Resume after GitHub pause: no intro, no re-asked picks, maps after confirm"
    vars:
      user_request: >
        Continue Release Autopilot setup. Earlier you recorded my picks: auto-flagging only, approval
        required, repo acme/demo in project default, LaunchDarkly managed inference. We paused while
        our GitHub org owner installed the App, and that is done now.
      max_turns: 20
      mock_overrides:
        get-automations:
          account:
            autoFlagging: { enabled: false, approvalRequired: false }
            autoReleasing: { enabled: false }
            version: 1
          repos:
            - { repo: acme/storefront, githubRepoId: 101, mapped: false, visibleOnInstall: true }
            - { repo: acme/api, githubRepoId: 102, mapped: false, visibleOnInstall: true }
            - { repo: acme/demo, githubRepoId: 103, mapped: false, visibleOnInstall: true }
          totalCount: 3
          hasMore: false
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:neverSendsApproval
        metric: never_sends_approval
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noIntro
        metric: no_intro
        weight: 2
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:noPickQuestions
        metric: no_repeated_picks
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmsBeforeWriting
        metric: confirms_before_writing
        weight: 3
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:repoTurnsAutoReleasingOff
        metric: repo_override_unpicked
        weight: 3

  # ------------------------------------------------------------------
  # The account write fails with 403 for an admin. The repo write comes
  # first, nothing is written after the failure, and the account change
  # is handed to an admin instead of being called complete.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Account write fails with 403: stop, hand off to an admin"
    vars:
      user_request: "Set up Release Autopilot auto-flagging for acme/demo in project default."
      max_turns: 20
      mock_overrides:
        get-automations:
          account:
            autoFlagging: { enabled: false, approvalRequired: false }
            autoReleasing: { enabled: false }
            version: 1
          repos:
            - { repo: acme/storefront, githubRepoId: 101, mapped: false, visibleOnInstall: true }
            - { repo: acme/api, githubRepoId: 102, mapped: false, visibleOnInstall: true }
            - { repo: acme/demo, githubRepoId: 103, mapped: false, visibleOnInstall: true }
          totalCount: 3
          hasMore: false
        update-automations:
          by_arg: accountWide
          cases:
            "true":
              error: "LaunchDarkly API error: 403: {\"code\":\"forbidden\",\"message\":\"Access to the requested resource was denied\"}"
          default: {}
      mock_ask_question_match: true
      mock_ask_question_answers:
