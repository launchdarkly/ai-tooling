  # ------------------------------------------------------------------
  # The MCP server has get-environment-release-plans but not the plan write
  # tools. The server is out of date, not the account: release setup is
  # skipped with an update-or-reconnect message, auto-releasing stays off,
  # and auto-flagging is still set up.
  # ------------------------------------------------------------------
  - providers: ["mcp"]
    description: "Release plan tools missing: update the MCP server, auto-flagging still set up"
    vars:
      user_request: "Set up Release Autopilot auto-flagging and auto-releasing for acme/demo in project default, production only."
      max_turns: 22
      exclude_mcp_tools: ["create-environment-release-plan", "update-default-environment-release-plan"]
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging", "Auto-releasing"]
        - ["LaunchDarkly's"]
        - ["Looks good"]
    assert:
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:missingPlanToolsSkipsRelease
        metric: missing_plan_tools
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:repoTurnsAutoReleasingOff
        metric: auto_releasing_off_without_plan_tools
        weight: 4
      - type: javascript
        value: file://../release-autopilot-onboarding/assertions.js:confirmsBeforeWriting
        metric: confirms_before_writing
        weight: 3

  # ------------------------------------------------------------------
  # Flag release plan with a shell: after "Looks good", the production
  # starter plan and its default come first, then the flag release plan
  # that names it (the project's default, beta header), then the repo
  # write. Verification reads the flag release plan back, and the
  # confirmation lists it. The token is never printed or asked for.
  # ------------------------------------------------------------------
  - providers: ["mcp-shell"]
    description: "Flag release plan: created after the release plan and its default, names it, project default, read back"
    vars:
      user_request: "Set up Release Autopilot auto-flagging and auto-releasing for acme/demo in project default, production only."
      max_turns: 30
      mock_overrides:
        get-metrics: { metrics: [], totalCount: 0 }
      mock_ask_question_match: true
      mock_ask_question_answers:
        - ["Add more"]
        - ["Auto-flagging", "Auto-releasing"]
        - ["LaunchDarkly's"]
        - ["Production"]
        - ["Progressive"]
        - ["Looks right"]
        - ["Looks good"]
    assert:
