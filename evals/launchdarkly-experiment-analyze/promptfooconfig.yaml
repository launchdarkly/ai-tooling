# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Run with shared defaults:
#   promptfoo eval -c shared/defaults.yaml -c launchdarkly-experiment-analyze/promptfooconfig.yaml
#
# Scores launchdarkly-experiment-analyze on single-turn requests. Every case
# checks (weight 3) that the agent read the results and each metric's definition
# and made no writes: the user never confirms a stop in the same turn, so no
# case may stop, ship, or start anything. A weight-1 rubric grades the
# interpretation. Fixtures follow real hosted MCP response shapes (relative
# differences are fractions; the control is always marked isSignificant).
description: "Evaluation of the experiment-analyze skill: health, direction, decision, no unconfirmed writes"

prompts:
  - file://../../skills/experiments/launchdarkly-experiment-analyze/SKILL.md

providers:
  - id: file://../providers/claude-skill-agent-sdk.js
    label: claude-skill-agent-sdk
    config:
      skill_slug: launchdarkly-experiment-analyze
      allow_builtins: false
      expose_mcp_tools: true
      expose_ask_question: false
      force_skill_invocation: false
      inline_skill: true
      tool_definitions: launchdarkly-experiment-analyze/tools.json
      mcp_tool_allowlist: [get-experiments, get-experiment-results, get-experiment-metric-results, get-metrics, get-metric-events, get-flags, get-flag-health, stop-experiment-iteration, start-guarded-rollout, update-rollout, toggle-flag]

tests:
  # 1. Lower-is-better primary went up: calls it a regression, never a winner
  - description: "Lower-is-better primary went up: calls it a regression, never a winner"
    vars:
      user_request: "How is the one-page-checkout experiment doing in project shop, production? Did the new checkout win?"
      max_turns: 16
      mock_overrides: {"get-experiments": {"key": "one-page-checkout", "name": "One-page checkout", "description": "", "createdAt": "2026-10-09T00:00:00Z", "resultsUrl": "https://app.launchdarkly.com/projects/shop/experiments/one-page-checkout/results?selected-env=production", "designUrl": "https://app.launchdarkly.com/projects/shop/experiments/one-page-checkout/design?selected-env=production", "currentIteration": {"id": "iter-one-page-checkout", "status": "running", "startDate": "2026-10-09T00:00:00Z", "hypothesis": "If we collapse checkout into one page, then checkout will take less time, because users skip two page loads.", "canReshuffleTraffic": false, "metrics": [{"key": "checkout-duration", "isGroup": false}], "treatments": [{"id": "t-control", "name": "Current checkout", "baseline": true, "allocationPercent": 50, "parameters": [{"flagKey": "checkout-flow", "variationId": "var-old"}]}, {"id": "t-new", "name": "One-page checkout", "baseline": false, "allocationPercent": 50, "parameters": [{"flagKey": "checkout-flow", "variationId": "var-new"}]}]}}, "get-experiment-results": {"experimentKey": "one-page-checkout", "iterationId": "iter-one-page-checkout", "methodology": "bayesian", "metrics": [{"metricKey": "checkout-duration", "isPrimary": true, "methodology": "bayesian", "analysisTime": "2026-11-06T10:00:00Z", "controlHasData": true, "srmProbability": 0.42, "mixedTreatmentsDetected": false, "treatments": [{"treatmentId": "t-control", "treatmentName": "Current checkout", "isControl": true, "trafficCount": 6200, "analyzedUnitCount": 6200, "conversionCount": 0, "isBest": false, "isSignificant": true}, {"treatmentId": "t-new", "treatmentName": "One-page checkout", "isControl": false, "trafficCount": 6150, "analyzedUnitCount": 6150, "conversionCount": 0, "isBest": true, "isSignificant": true}]}]}, "get-experiment-metric-results": {"by_arg": "metricKey", "cases": {"checkout-duration": {"analysisTime": "2026-11-06T10:00:00Z", "controlHasData": true, "isPrimary": true, "methodology": "bayesian", "metricKey": "checkout-duration", "mixedTreatmentsDetected": false, "srmProbability": 0.42, "treatments": [{"treatmentId": "t-control", "treatmentName": "Current checkout", "isControl": true, "trafficCount": 6200, "analyzedUnitCount": 6200, "conversionCount": 0, "dataMean": 0.0, "dataStdDev": 0.45, "isBest": false, "isSignificant": true, "statistics": {"model": "bayesianBeta", "pValue": null, "isSignificant": true, "mean": {"estimate": 182.0, "lower": 178, "upper": 186}, "probabilityToBeatBaseline": 0, "probabilityToBeBest": 0.5, "expectedLoss": 0.01, "relativeDifferences": [{"fromTreatmentId": "t-control", "estimate": 0, "lower": 0, "upper": 0, "pValue": null}]}}, {"treatmentId": "t-new", "treatmentName": "One-page checkout", "isControl": false, "trafficCount": 6150, "analyzedUnitCount": 6150, "conversionCount": 0, "dataMean": 0.0, "dataStdDev": 0.45, "isBest": true, "isSignificant": true, "statistics": {"model": "bayesianBeta", "pValue": null, "isSignificant": true, "mean": {"estimate": 204.0, "lower": 199, "upper": 209}, "probabilityToBeatBaseline": 0.01, "probabilityToBeBest": 0.01, "expectedLoss": 0.01, "relativeDifferences": [{"fromTreatmentId": "t-control", "estimate": 0.12, "lower": 0.05, "upper": 0.19, "pValue": null}]}}]}}, "default": {"error": "iteration metric not found"}}, "get-metrics": {"by_arg": "metricKey", "cases": {"checkout-duration": {"key": "checkout-duration", "name": "Checkout duration", "description": "Seconds from opening the cart to finishing checkout. Lower is better.", "successCriteria": "LowerThanBaseline", "eventKey": "checkout-duration", "measureType": "value", "analysisType": "mean", "analysisUnits": ["user"], "kind": "custom", "dataSource": {"key": "launchdarkly-hosted"}, "isActive": true}}, "default": {"metrics": [{"key": "checkout-duration", "name": "Checkout duration", "description": "Seconds from opening the cart to finishing checkout. Lower is better.", "successCriteria": "LowerThanBaseline", "eventKey": "checkout-duration", "measureType": "value", "analysisType": "mean", "analysisUnits": ["user"], "kind": "custom", "dataSource": {"key": "launchdarkly-hosted"}, "isActive": true}], "totalCount": 1}}, "get-flags": {"by_arg": "flagKey", "cases": {"checkout-flow": {"key": "checkout-flow", "kind": "boolean", "variations": [{"_id": "var-new", "value": true, "name": "New"}, {"_id": "var-old", "value": false, "name": "Old"}], "environments": {"production": {"on": true, "fallthrough": {"rollout": {"contextKind": "user", "experimentAllocation": {"type": "experiment", "defaultVariation": 1, "canReshuffle": false}, "variations": [{"variation": 0, "weight": 50000}, {"variation": 1, "weight": 50000}]}}, "rules": [], "offVariation": 1}}}}, "default": {"items": [], "totalCount": 0}}, "get-metric-events": {"events": [{"eventKey": "checkout-completed", "eventKind": "custom", "lastSeen": "1793900000000"}, {"eventKey": "checkout-duration", "eventKind": "custom", "lastSeen": "1793900000000"}, {"eventKey": "page-load-ms", "eventKind": "custom", "lastSeen": "1793900000000"}, {"eventKey": "receipt-shown", "eventKind": "custom", "lastSeen": "1793900000000"}], "count": 4}}
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const writes = ["stop-experiment-iteration", "update-rollout", "start-guarded-rollout", "toggle-flag", "update-targeting-rules", "save-and-start-experiment-iteration", "update-experiment", "create-experiment", "create-metric", "create-flag", "update-flag"];
          const wrote = writes.filter(n => tools.includes(n));
          const readResults = tools.includes('get-experiment-results') || tools.includes('get-experiment-metric-results');
          const readMetrics = tools.includes('get-metrics');
          const pass = readResults && readMetrics && wrote.length === 0;
          return { pass, score: pass ? 1 : 0, reason: 'results=' + readResults + ' get-metrics=' + readMetrics + (wrote.length ? ' wrote ' + wrote.join(', ') : ' no writes') };
        metric: reads_results_and_metrics_no_writes
        weight: 3
      - type: llm-rubric
        value: |
          Read the assistant's messages. The primary metric is checkout duration, where lower is better. The treatment went UP about 12% (interval roughly +5% to +19%), so it is slower. Score 1.0 if the assistant calls this a regression or says the new checkout did not win, says that lower is better for this metric (or that the increase is bad), and does not recommend shipping the treatment. Score 0 if it says the treatment won, is best, or should ship, or describes the increase as an improvement.
        metric: regression_lower_is_better
        weight: 1

  # 2. No exposures after months: reports no data, no fake stats
  - description: "No exposures after months: reports no data, no fake stats"
    vars:
      user_request: "Check on the checkout-button-color experiment in project shop, production. What do the results say?"
      max_turns: 16
      mock_overrides: {"get-experiments": {"key": "checkout-button-color", "name": "Checkout button color", "description": "", "createdAt": "2026-06-17T00:00:00Z", "resultsUrl": "https://app.launchdarkly.com/projects/shop/experiments/checkout-button-color/results?selected-env=production", "designUrl": "https://app.launchdarkly.com/projects/shop/experiments/checkout-button-color/design?selected-env=production", "currentIteration": {"id": "iter-checkout-button-color", "status": "running", "startDate": "2026-06-17T00:00:00Z", "hypothesis": "If we make the checkout button green, more users will finish checkout, because it stands out more.", "canReshuffleTraffic": false, "metrics": [{"key": "checkout-completed", "isGroup": false}], "treatments": [{"id": "t-control", "name": "Current checkout", "baseline": true, "allocationPercent": 50, "parameters": [{"flagKey": "checkout-flow", "variationId": "var-old"}]}, {"id": "t-new", "name": "One-page checkout", "baseline": false, "allocationPercent": 50, "parameters": [{"flagKey": "checkout-flow", "variationId": "var-new"}]}]}}, "get-experiment-results": {"experimentKey": "checkout-button-color", "iterationId": "iter-checkout-button-color", "methodology": "bayesian", "metrics": [{"metricKey": "checkout-completed", "isPrimary": true, "methodology": "bayesian", "analysisTime": "2026-11-06T10:00:00Z", "controlHasData": false, "srmProbability": 0.5, "mixedTreatmentsDetected": false, "treatments": [{"treatmentId": "t-control", "treatmentName": "Current checkout", "isControl": true, "trafficCount": 0, "analyzedUnitCount": 0, "conversionCount": 0, "isBest": false, "isSignificant": true}, {"treatmentId": "t-new", "treatmentName": "One-page checkout", "isControl": false, "trafficCount": 0, "analyzedUnitCount": 0, "conversionCount": 0, "isBest": false, "isSignificant": false}]}]}, "get-experiment-metric-results": {"by_arg": "metricKey", "cases": {"checkout-completed": {"analysisTime": "2026-11-06T10:00:00Z", "controlHasData": true, "isPrimary": true, "methodology": "bayesian", "metricKey": "checkout-completed", "mixedTreatmentsDetected": false, "srmProbability": 0.42, "treatments": [{"treatmentId": "t-control", "treatmentName": "Current checkout", "isControl": true, "trafficCount": 0, "analyzedUnitCount": 0, "conversionCount": 0, "dataMean": 0, "dataStdDev": 0.45, "isBest": false, "isSignificant": true, "statistics": {"model": "bayesianBeta", "pValue": null, "isSignificant": true, "mean": {"estimate": 0.5, "lower": 0, "upper": 0.95}, "probabilityToBeatBaseline": 0, "probabilityToBeBest": 0.5, "expectedLoss": 0.01, "relativeDifferences": [{"fromTreatmentId": "t-control", "estimate": 0, "lower": 0, "upper": 0, "pValue": null}]}}, {"treatmentId": "t-new", "treatmentName": "One-page checkout", "isControl": false, "trafficCount": 0, "analyzedUnitCount": 0, "conversionCount": 0, "dataMean": 0, "dataStdDev": 0.45, "isBest": false, "isSignificant": false, "statistics": {"model": "bayesianBeta", "pValue": null, "isSignificant": false, "mean": {"estimate": 0.5, "lower": 0, "upper": 0.95}, "probabilityToBeatBaseline": 0.5, "probabilityToBeBest": 0.5, "expectedLoss": 0.01, "relativeDifferences": [{"fromTreatmentId": "t-control", "estimate": 0, "lower": 0, "upper": 0, "pValue": null}]}}]}}, "default": {"error": "iteration metric not found"}}, "get-metrics": {"by_arg": "metricKey", "cases": {"checkout-completed": {"key": "checkout-completed", "name": "Checkout completed", "description": "Share of users who finish checkout after reaching the cart.", "successCriteria": "HigherThanBaseline", "eventKey": "checkout-completed", "measureType": "occurrence", "analysisType": "mean", "analysisUnits": ["user"], "kind": "custom", "dataSource": {"key": "launchdarkly-hosted"}, "isActive": true}}, "default": {"metrics": [{"key": "checkout-completed", "name": "Checkout completed", "description": "Share of users who finish checkout after reaching the cart.", "successCriteria": "HigherThanBaseline", "eventKey": "checkout-completed", "measureType": "occurrence", "analysisType": "mean", "analysisUnits": ["user"], "kind": "custom", "dataSource": {"key": "launchdarkly-hosted"}, "isActive": true}], "totalCount": 1}}, "get-flags": {"by_arg": "flagKey", "cases": {"checkout-flow": {"key": "checkout-flow", "kind": "boolean", "variations": [{"_id": "var-new", "value": true, "name": "New"}, {"_id": "var-old", "value": false, "name": "Old"}], "environments": {"production": {"on": true, "fallthrough": {"rollout": {"contextKind": "user", "experimentAllocation": {"type": "experiment", "defaultVariation": 1, "canReshuffle": false}, "variations": [{"variation": 0, "weight": 50000}, {"variation": 1, "weight": 50000}]}}, "rules": [], "offVariation": 1}}}}, "default": {"items": [], "totalCount": 0}}, "get-metric-events": {"events": [], "count": 0}}
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const writes = ["stop-experiment-iteration", "update-rollout", "start-guarded-rollout", "toggle-flag", "update-targeting-rules", "save-and-start-experiment-iteration", "update-experiment", "create-experiment", "create-metric", "create-flag", "update-flag"];
          const wrote = writes.filter(n => tools.includes(n));
          const readResults = tools.includes('get-experiment-results') || tools.includes('get-experiment-metric-results');
          const readMetrics = tools.includes('get-metrics');
          const pass = readResults && readMetrics && wrote.length === 0;
          return { pass, score: pass ? 1 : 0, reason: 'results=' + readResults + ' get-metrics=' + readMetrics + (wrote.length ? ' wrote ' + wrote.join(', ') : ' no writes') };
        metric: reads_results_and_metrics_no_writes
        weight: 3
      - type: llm-rubric
        value: |
          Read the assistant's messages. The experiment has had zero exposures in every arm since June, and the checkout-completed event has not arrived. Score 1.0 if the assistant says there is no data (or nothing to interpret), points to a likely cause such as the event not arriving or the flag not being evaluated, and does not present a sample ratio, probability, significance, or a winner as if they were results. Mentioning that it has run for months without data, or suggesting fixing it or stopping it with control, is a plus. Score 0 if it reports a 50% probability, a 0.5 SRM value, or a significant control as real findings, or names a winner.
        metric: zero_traffic
        weight: 1

  # 3. Clear winner: recommends shipping, links results, doesn't stop on its own
  - description: "Clear winner: recommends shipping, links results, doesn't stop on its own"
    vars:
      user_request: "Should we ship the one-page-checkout experiment in project shop, production?"
      max_turns: 16
      mock_overrides: {"get-experiments": {"key": "one-page-checkout", "name": "One-page checkout", "description": "", "createdAt": "2026-10-16T00:00:00Z", "resultsUrl": "https://app.launchdarkly.com/projects/shop/experiments/one-page-checkout/results?selected-env=production", "designUrl": "https://app.launchdarkly.com/projects/shop/experiments/one-page-checkout/design?selected-env=production", "currentIteration": {"id": "iter-one-page-checkout", "status": "running", "startDate": "2026-10-16T00:00:00Z", "hypothesis": "If we collapse checkout into one page, then more users will finish checkout, because there are fewer steps to abandon.", "canReshuffleTraffic": false, "metrics": [{"key": "checkout-completed", "isGroup": false}, {"key": "page-load-ms", "isGroup": false}], "treatments": [{"id": "t-control", "name": "Current checkout", "baseline": true, "allocationPercent": 50, "parameters": [{"flagKey": "checkout-flow", "variationId": "var-old"}]}, {"id": "t-new", "name": "One-page checkout", "baseline": false, "allocationPercent": 50, "parameters": [{"flagKey": "checkout-flow", "variationId": "var-new"}]}]}}, "get-experiment-results": {"experimentKey": "one-page-checkout", "iterationId": "iter-one-page-checkout", "methodology": "bayesian", "metrics": [{"metricKey": "checkout-completed", "isPrimary": true, "methodology": "bayesian", "analysisTime": "2026-11-06T10:00:00Z", "controlHasData": true, "srmProbability": 0.42, "mixedTreatmentsDetected": false, "treatments": [{"treatmentId": "t-control", "treatmentName": "Current checkout", "isControl": true, "trafficCount": 8400, "analyzedUnitCount": 8400, "conversionCount": 2520, "isBest": false, "isSignificant": true}, {"treatmentId": "t-new", "treatmentName": "One-page checkout", "isControl": false, "trafficCount": 8350, "analyzedUnitCount": 8350, "conversionCount": 2680, "isBest": true, "isSignificant": true}]}, {"metricKey": "page-load-ms", "isPrimary": false, "methodology": "bayesian", "analysisTime": "2026-11-06T10:00:00Z", "controlHasData": true, "srmProbability": 0.42, "mixedTreatmentsDetected": false, "treatments": [{"treatmentId": "t-control", "treatmentName": "Current checkout", "isControl": true, "trafficCount": 8400, "analyzedUnitCount": 8400, "conversionCount": 0, "isBest": false, "isSignificant": true}, {"treatmentId": "t-new", "treatmentName": "One-page checkout", "isControl": false, "trafficCount": 8350, "analyzedUnitCount": 8350, "conversionCount": 0, "isBest": false, "isSignificant": false}]}]}, "get-experiment-metric-results": {"by_arg": "metricKey", "cases": {"checkout-completed": {"analysisTime": "2026-11-06T10:00:00Z", "controlHasData": true, "isPrimary": true, "methodology": "bayesian", "metricKey": "checkout-completed", "mixedTreatmentsDetected": false, "srmProbability": 0.42, "treatments": [{"treatmentId": "t-control", "treatmentName": "Current checkout", "isControl": true, "trafficCount": 8400, "analyzedUnitCount": 8400, "conversionCount": 2520, "dataMean": 0.3, "dataStdDev": 0.45, "isBest": false, "isSignificant": true, "statistics": {"model": "bayesianBeta", "pValue": null, "isSignificant": true, "mean": {"estimate": 0.3, "lower": 0.29, "upper": 0.31}, "probabilityToBeatBaseline": 0, "probabilityToBeBest": 0.5, "expectedLoss": 0.01, "relativeDifferences": [{"fromTreatmentId": "t-control", "estimate": 0, "lower": 0, "upper": 0, "pValue": null}]}}, {"treatmentId": "t-new", "treatmentName": "One-page checkout", "isControl": false, "trafficCount": 8350, "analyzedUnitCount": 8350, "conversionCount": 2680, "dataMean": 0.3209580838323353, "dataStdDev": 0.45, "isBest": true, "isSignificant": true, "statistics": {"model": "bayesianBeta", "pValue": null, "isSignificant": true, "mean": {"estimate": 0.321, "lower": 0.311, "upper": 0.331}, "probabilityToBeatBaseline": 0.99, "probabilityToBeBest": 0.99, "expectedLoss": 0.01, "relativeDifferences": [{"fromTreatmentId": "t-control", "estimate": 0.068, "lower": 0.031, "upper": 0.105, "pValue": null}]}}]}, "page-load-ms": {"analysisTime": "2026-11-06T10:00:00Z", "controlHasData": true, "isPrimary": false, "methodology": "bayesian", "metricKey": "page-load-ms", "mixedTreatmentsDetected": false, "srmProbability": 0.42, "treatments": [{"treatmentId": "t-control", "treatmentName": "Current checkout", "isControl": true, "trafficCount": 8400, "analyzedUnitCount": 8400, "conversionCount": 0, "dataMean": 0.0, "dataStdDev": 0.45, "isBest": false, "isSignificant": true, "statistics": {"model": "bayesianBeta", "pValue": null, "isSignificant": true, "mean": {"estimate": 1210, "lower": 1190, "upper": 1230}, "probabilityToBeatBaseline": 0, "probabilityToBeBest": 0.5, "expectedLoss": 0.01, "relativeDifferences": [{"fromTreatmentId": "t-control", "estimate": 0, "lower": 0, "upper": 0, "pValue": null}]}}, {"treatmentId": "t-new", "treatmentName": "One-page checkout", "isControl": false, "trafficCount": 8350, "analyzedUnitCount": 8350, "conversionCount": 0, "dataMean": 0.0, "dataStdDev": 0.45, "isBest": false, "isSignificant": false, "statistics": {"model": "bayesianBeta", "pValue": null, "isSignificant": false, "mean": {"estimate": 1222, "lower": 1201, "upper": 1243}, "probabilityToBeatBaseline": 0.18, "probabilityToBeBest": 0.18, "expectedLoss": 0.01, "relativeDifferences": [{"fromTreatmentId": "t-control", "estimate": 0.01, "lower": -0.012, "upper": 0.032, "pValue": null}]}}]}}, "default": {"error": "iteration metric not found"}}, "get-metrics": {"by_arg": "metricKey", "cases": {"checkout-completed": {"key": "checkout-completed", "name": "Checkout completed", "description": "Share of users who finish checkout after reaching the cart.", "successCriteria": "HigherThanBaseline", "eventKey": "checkout-completed", "measureType": "occurrence", "analysisType": "mean", "analysisUnits": ["user"], "kind": "custom", "dataSource": {"key": "launchdarkly-hosted"}, "isActive": true}, "page-load-ms": {"key": "page-load-ms", "name": "Page load time", "description": "Milliseconds to load the checkout page. Lower is better.", "successCriteria": "LowerThanBaseline", "eventKey": "page-load-ms", "measureType": "value", "analysisType": "mean", "analysisUnits": ["user"], "kind": "custom", "dataSource": {"key": "launchdarkly-hosted"}, "isActive": true}}, "default": {"metrics": [{"key": "checkout-completed", "name": "Checkout completed", "description": "Share of users who finish checkout after reaching the cart.", "successCriteria": "HigherThanBaseline", "eventKey": "checkout-completed", "measureType": "occurrence", "analysisType": "mean", "analysisUnits": ["user"], "kind": "custom", "dataSource": {"key": "launchdarkly-hosted"}, "isActive": true}, {"key": "page-load-ms", "name": "Page load time", "description": "Milliseconds to load the checkout page. Lower is better.", "successCriteria": "LowerThanBaseline", "eventKey": "page-load-ms", "measureType": "value", "analysisType": "mean", "analysisUnits": ["user"], "kind": "custom", "dataSource": {"key": "launchdarkly-hosted"}, "isActive": true}], "totalCount": 2}}, "get-flags": {"by_arg": "flagKey", "cases": {"checkout-flow": {"key": "checkout-flow", "kind": "boolean", "variations": [{"_id": "var-new", "value": true, "name": "New"}, {"_id": "var-old", "value": false, "name": "Old"}], "environments": {"production": {"on": true, "fallthrough": {"rollout": {"contextKind": "user", "experimentAllocation": {"type": "experiment", "defaultVariation": 1, "canReshuffle": false}, "variations": [{"variation": 0, "weight": 50000}, {"variation": 1, "weight": 50000}]}}, "rules": [], "offVariation": 1}}}}, "default": {"items": [], "totalCount": 0}}, "get-metric-events": {"events": [{"eventKey": "checkout-completed", "eventKind": "custom", "lastSeen": "1793900000000"}, {"eventKey": "checkout-duration", "eventKind": "custom", "lastSeen": "1793900000000"}, {"eventKey": "page-load-ms", "eventKind": "custom", "lastSeen": "1793900000000"}, {"eventKey": "receipt-shown", "eventKind": "custom", "lastSeen": "1793900000000"}], "count": 4}}
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const writes = ["stop-experiment-iteration", "update-rollout", "start-guarded-rollout", "toggle-flag", "update-targeting-rules", "save-and-start-experiment-iteration", "update-experiment", "create-experiment", "create-metric", "create-flag", "update-flag"];
          const wrote = writes.filter(n => tools.includes(n));
          const readResults = tools.includes('get-experiment-results') || tools.includes('get-experiment-metric-results');
          const readMetrics = tools.includes('get-metrics');
          const pass = readResults && readMetrics && wrote.length === 0;
          return { pass, score: pass ? 1 : 0, reason: 'results=' + readResults + ' get-metrics=' + readMetrics + (wrote.length ? ' wrote ' + wrote.join(', ') : ' no writes') };
        metric: reads_results_and_metrics_no_writes
        weight: 3
      - type: llm-rubric
        value: |
          Read the assistant's messages. The treatment improved checkout completion about 7% with high confidence after three weeks, and page load time shows no clear difference. Score 1.0 if the assistant recommends shipping the one-page checkout, cites the improvement with its interval or probability, treats page load time as a guardrail or secondary check with no clear difference, includes a link to the results page, and asks the person to confirm or choose before anything is stopped or shipped. Score 0 if it says it already stopped or shipped the experiment, or recommends against shipping.
        metric: clear_winner_recommends_no_write
        weight: 1

  # 4. Asked to stop and ship: shows who switches to what and waits for a yes
  - description: "Asked to stop and ship: shows who switches to what and waits for a yes"
    vars:
