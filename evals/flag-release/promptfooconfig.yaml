# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Run with shared defaults:
#   promptfoo eval -c shared/defaults.yaml -c flag-release/promptfooconfig.yaml
#
# flag-release starts the release of an EXISTING flag guarding a PR. It
# operates entirely through the LaunchDarkly MCP tools (no code exploration):
# it picks the project's flag release plan with get-flag-release-plans,
# previews the environment release plans it names with
# get-environment-release-plans, captures the human's release intent, and
# starts the release with create-flag-release. A held environment must be left
# out of the plan or wait for a person (triggerType manual); the skill never
# starts a plan that releases a held environment. create-flag-release is a
# preview tool, so without it (not listed, or "tool disabled") the skill
# records the release with create-automated-rollout-config, leaving held
# environments out. It never creates flags or edits code, and the suite hides
# the retired release policy tools.
#
# Two providers, both MCP-only (no builtins):
#   mcp           the hosted server with the flag release tools
#   mcp-fallback  a server without them, which takes the
#                 create-automated-rollout-config path
# The mocks return the guarding flag as existing and OFF, a guarded default
# release plan for every environment, and two flag release plans: the default
# "standard-release" (dev, then staging, then production on promotion) and
# "production-by-hand" (production waits for a person)
# (flag-release/tool-mocks.json). The tool definitions match the hosted server
# (flag-release/tool-definitions.json).
description: "Evaluation of the flag-release skill (starting flag releases)"

prompts:
  - file://../../skills/feature-flags/flag-release/SKILL.md

providers:
  - id: file://../providers/claude-skill-agent-sdk.js
    label: mcp
    config:
      skill_slug: flag-release
      allow_builtins: false
      # With builtins off, listing the skill does not load its text, so put
      # SKILL.md in the agent's instructions.
      inline_skill: true
      # The cases name dev, staging, and production; this suite's
      # get-projects (with projectKey) mock returns exactly those, so an agent
      # that checks environments first finds them without a stray test env.
      tool_mocks: flag-release/tool-mocks.json
      tool_definitions: flag-release/tool-definitions.json
      # Release policies are replaced by environment release plans at GA, and
      # these skills no longer use them, so the suites run on a server
      # without the release policy tools.
      exclude_mcp_tools: ["match-release-policies", "get-release-policies"]
  # A server without the flag release preview tools
  # (enable-flag-release-plans-mcp off): the skill falls back to
  # create-automated-rollout-config.
  - id: file://../providers/claude-skill-agent-sdk.js
    label: mcp-fallback
    config:
      skill_slug: flag-release
      allow_builtins: false
      inline_skill: true
      tool_mocks: flag-release/tool-mocks.json
      tool_definitions: flag-release/tool-definitions.json
      exclude_mcp_tools: ["match-release-policies", "get-release-policies", "create-flag-release", "get-flag-release-plans"]

tests:
  # ==================================================================
  # FALLBACK PATH (mcp-fallback). The cases below, up to the flag
  # release cases, run on a server without create-flag-release, so the
  # skill records the release with create-automated-rollout-config and
  # holds an environment by leaving it out of `environments`.
  # ==================================================================

  # ==================================================================
  # HOLD INTENT — staging releases on merge, production is held until a
  # future date. The skill must record staging but NOT record a
  # releasing plan for production (leave it OFF, report it held), never
  # silently releasing against the stated intent.
  #
  # REGRESSION GUARD (2026-07): sonnet used to fail this — it recorded
  # production as `policy` (which auto-releases on merge) or invented a
  # `holdUntil` field, because the mock tool description said policy
  # "defers" (reads as "hold") and silently accepted unknown fields. The
  # fix made the mock tool description faithful to the real tool (no
  # hold/date field exists; omit the env to hold it) and named the tell
  # in the skill. Correct behavior: production is OMITTED from the
  # environments array entirely. Do NOT weaken these assertions — they
  # lock in that fix.
  # ==================================================================
  - description: "Hold intent: records staging on merge but holds production, honoring the stated hold"
    providers: ["mcp-fallback"]
    vars:
      user_request: >
        The guarding flag `new-checkout-flow` already exists (created OFF) for
        PR acme/storefront#482, project `default`. Record its automated release:
        staging should release on merge, but hold production until 2099-09-01 —
        legal hasn't signed off yet.
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const pass = tools.includes('get-environment-release-plans');
          return { pass, score: pass ? 1 : 0, reason: pass ? 'previewed the default release plans' : 'did not call get-environment-release-plans' };
        metric: previewed_release_plan
        weight: 2

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          if (!rec) return { pass: false, score: 0, reason: 'never recorded a rollout (staging should have been recorded)' };
          const envs = (rec.arguments && rec.arguments.environments) || [];
          const keys = envs.map(e => e.environmentKey);
          const hasStaging = keys.includes('staging');
          const hasProd = keys.includes('production');
          const pass = hasStaging && !hasProd;
          return { pass, score: pass ? 1 : 0, reason: `recorded envs=[${keys.join(', ')}] (want staging, NOT production)` };
        metric: honored_hold
        weight: 4

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          const envs = rec ? ((rec.arguments && rec.arguments.environments) || []) : [];
          const forbidden = ['holdUntil','notBefore','hold','releaseDate','scheduledDate','releaseAt','until'];
          const bad = [];
          for (const e of envs) for (const k of Object.keys(e || {})) if (forbidden.includes(k)) bad.push(k);
          const pass = bad.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no fabricated hold/date fields' : 'invented per-env fields: ' + [...new Set(bad)].join(', ') };
        metric: no_fabricated_fields
        weight: 2

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['toggle-flag','update-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'did not toggle the flag by hand' : 'called: ' + called.join(', ') };
        metric: no_manual_toggle
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to release `new-checkout-flow` for PR acme/storefront#482:
          staging on merge, but HOLD production until 2099-09-01.
          Evaluate the response:
          1. Does it record/plan staging to release on merge?
          2. Does it explicitly HOLD production (leave it OFF, not released on merge)
             and state the reason / the notBefore date, rather than silently
             releasing or silently dropping the hold?
          3. Did it avoid turning the flag on by hand?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # DEFAULT PLAN EXISTS (happy path) — staging immediate or default plan,
  # production with its default release plan. The skill reads the
  # default plans, then records BOTH environments, production as
  # `policy` (which starts the environment's default release plan).
  # ==================================================================
  - description: "Default plan exists: reads the default release plans and records staging and production, production with its default plan"
    providers: ["mcp-fallback"]
    vars:
      user_request: >
        The flag `search-v2` already exists (created OFF) for PR acme/web#77,
        project `default`. Record its automated release for `staging` and
        `production` — release it on merge, and set each environment up
        appropriately (check what each environment's release setup would do).
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const envs = traj.filter(t => t.tool === 'get-environment-release-plans').map(t => (t.arguments || {}).environmentKey);
          const pass = envs.includes('production');
          return { pass, score: pass ? 1 : 0, reason: `read release plans for [${envs.join(', ')}] (want production)` };
        metric: previewed_release_plan
        weight: 2

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          if (!rec) return { pass: false, score: 0, reason: 'never recorded the rollout' };
          const envs = (rec.arguments && rec.arguments.environments) || [];
          const byKey = Object.fromEntries(envs.map(e => [e.environmentKey, e.releaseType]));
          const pass = 'staging' in byKey && byKey.production === 'policy';
          return { pass, score: pass ? 1 : 0, reason: `recorded ${JSON.stringify(byKey)} (want staging, and production as policy)` };
        metric: recorded_both_envs
        weight: 4

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['toggle-flag','update-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'did not toggle the flag by hand' : 'called: ' + called.join(', ') };
        metric: no_manual_toggle
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to record the release for `search-v2` (PR acme/web#77) for
          staging and production, releasing on merge. Production's default release
          plan is "Guarded rollout": 10% -> 25% -> 50% with automatic rollback on
          error-rate and latency-p95.
          Evaluate the response:
          1. Did it record both environments with a sensible release type
             (immediate or the default release plan) for each?
          2. Does it explain what happens on merge for each environment, grounded in
             the default release plan it read (e.g. production starts the guarded
             plan with those steps and metrics)?
          3. Did it avoid turning the flag on by hand?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 2

  # ==================================================================
  # NO DEFAULT PLAN — staging has a default release plan, production has
  # only a plan that is not the default. Auto-release can't run in
  # production, so the skill records staging, leaves production out
  # (no `policy` entry), says production needs a default release plan,
  # and points to onboarding or the release plan settings. There is no
  # fallback to release policies.
  # ==================================================================
  - description: "No default plan: records staging, holds production until it has a default release plan"
    providers: ["mcp-fallback"]
    vars:
      user_request: >
        The flag `invoice-retry` already exists (created OFF) for PR
        acme/billing#310, project `default`. Record its automated release for
        `staging` and `production`, releasing on merge with each environment's
        release plan.
      mock_overrides:
        get-environment-release-plans:
          by_arg: environmentKey
          cases:
            production:
              items:
                - key: slow-ramp
                  name: Slow ramp
                  environmentKey: production
                  default: false
                  progressiveRelease:
                    randomizationUnit: user
                    advancementMode: manual
                    cleanupBehavior: remove_rules_and_update_default_rule
                    phases:
                      - clauses: [{ attribute: kind, op: in, values: ["user"], contextKind: user }]
                        steps: [{ allocation: 5000, durationMillis: 86400000 }]
                    metrics: {}
              totalCount: 1
          default:
            items:
              - key: progressive
                name: Progressive
                environmentKey: staging
                default: true
                progressiveRelease:
                  randomizationUnit: user
                  advancementMode: automatic
                  cleanupBehavior: remove_rules_and_update_default_rule
                  phases:
                    - clauses: [{ attribute: kind, op: in, values: ["user"], contextKind: user }]
                      steps: [{ allocation: 10000, durationMillis: 14400000 }, { allocation: 50000, durationMillis: 14400000 }]
                  metrics: {}
            totalCount: 1
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const envs = traj.filter(t => t.tool === 'get-environment-release-plans').map(t => (t.arguments || {}).environmentKey);
          const pass = envs.includes('production');
          return { pass, score: pass ? 1 : 0, reason: `read release plans for [${envs.join(', ')}] (want production)` };
        metric: previewed_release_plan
        weight: 2

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          const envs = rec ? ((rec.arguments && rec.arguments.environments) || []) : [];
          const prod = envs.find(e => e.environmentKey === 'production');
          const pass = !prod;
          return { pass, score: pass ? 1 : 0, reason: prod ? 'recorded production with no default release plan: ' + JSON.stringify(prod) : 'production left out' };
        metric: held_no_default_plan
        weight: 4

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['toggle-flag','update-flag','delete-flag','create-environment-release-plan','update-default-environment-release-plan'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no flag toggles or release plan writes' : 'called: ' + called.join(', ') };
        metric: no_manual_toggle
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to record the release for `invoice-retry` (PR
          acme/billing#310) for staging and production, releasing on merge with each
          environment's release plan. Staging has a default release plan
          ("Progressive"). Production has a plan ("Slow ramp") that is NOT the
          default, so production has no default release plan.
          Evaluate the response:
          1. Does it record or plan staging to release on merge?
          2. Does it say that auto-release can't run in production until production
             has a default release plan, and leave production unreleased, rather than
             releasing it with the non-default plan or silently?
          3. Does it point the user to where to set a default release plan (for
             example the release plans skill, the Release Autopilot onboarding skill,
             or the environment's release plan settings), without creating or
             changing a release plan itself?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # MULTI-ENV MIXED INTENT — three environments, two release, one holds.
  # The RELEASE/HOLD sort must scale past two envs: record dev + staging,
  # OMIT production. Guards against "list every environment the user
  # named" completeness bias.
  # ==================================================================
  - description: "Multi-env mixed intent: releases dev and staging, holds production"
    providers: ["mcp-fallback"]
    vars:
      user_request: >
        The flag `bulk-import` already exists (created OFF) for PR acme/platform#1204,
        project `default`. Record its automated release across `dev`, `staging`, and
        `production`: release dev and staging on merge, but hold production — the
        data-migration runbook isn't signed off yet.
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          if (!rec) return { pass: false, score: 0, reason: 'never recorded a rollout (dev+staging should have been recorded)' };
          const keys = ((rec.arguments && rec.arguments.environments) || []).map(e => e.environmentKey);
          const pass = keys.includes('dev') && keys.includes('staging') && !keys.includes('production');
          return { pass, score: pass ? 1 : 0, reason: `recorded envs=[${keys.join(', ')}] (want dev+staging, NOT production)` };
        metric: honored_hold
        weight: 4

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          const envs = rec ? ((rec.arguments && rec.arguments.environments) || []) : [];
          const forbidden = ['holdUntil','notBefore','hold','releaseDate','scheduledDate','releaseAt','until'];
          const bad = [];
          for (const e of envs) for (const k of Object.keys(e || {})) if (forbidden.includes(k)) bad.push(k);
          const pass = bad.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no fabricated hold/date fields' : 'invented per-env fields: ' + [...new Set(bad)].join(', ') };
        metric: no_fabricated_fields
        weight: 2

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['toggle-flag','update-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'did not toggle the flag by hand' : 'called: ' + called.join(', ') };
        metric: no_manual_toggle
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to release `bulk-import` (PR acme/platform#1204) across dev,
          staging, and production: release dev and staging on merge, HOLD production
          (runbook not signed off).
          Evaluate the response:
          1. Does it record/plan dev and staging to release on merge?
          2. Does it explicitly HOLD production (leave it out of the recorded config,
             not released on merge) and state the reason, rather than silently
             releasing it or dropping the hold?
          3. Did it avoid turning the flag on by hand?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # SINGLE-TARGET DATE HOLD — the only named environment is held until a
  # date. There is nothing to release, so the correct outcome is: do NOT
  # record production as releasing (either omit it, or don't call the tool
  # at all) and report it held. Guards against recording a releasing plan
  # just because the tool "should" be called.
  # ==================================================================
  - description: "Single-target date hold: the only environment is held, so nothing releases"
    providers: ["mcp-fallback"]
    vars:
      user_request: >
        The flag `checkout-redesign` already exists (created OFF) for PR
        acme/store#900, project `default`. Record its automated release for
        `production`, but do not release it until 2099-10-01 — we're still finalizing
        rollout sign-off.
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          const keys = rec ? ((rec.arguments && rec.arguments.environments) || []).map(e => e.environmentKey) : [];
          const pass = !keys.includes('production');
          return { pass, score: pass ? 1 : 0, reason: rec ? `recorded envs=[${keys.join(', ')}] (production must be absent)` : 'no releasing rollout recorded — production held (ok)' };
        metric: honored_hold
        weight: 4

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          const envs = rec ? ((rec.arguments && rec.arguments.environments) || []) : [];
          const forbidden = ['holdUntil','notBefore','hold','releaseDate','scheduledDate','releaseAt','until'];
          const bad = [];
          for (const e of envs) for (const k of Object.keys(e || {})) if (forbidden.includes(k)) bad.push(k);
          const pass = bad.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no fabricated hold/date fields' : 'invented per-env fields: ' + [...new Set(bad)].join(', ') };
        metric: no_fabricated_fields
        weight: 2

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['toggle-flag','update-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'did not toggle the flag by hand' : 'called: ' + called.join(', ') };
        metric: no_manual_toggle
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to record the release for `checkout-redesign` (PR
          acme/store#900) for production, but NOT to release it until 2099-10-01.
          Evaluate the response:
          1. Does it hold production — not recording it to release on merge (before
             the date), and stating it is held until 2099-10-01?
          2. Does it avoid inventing a hold/date field the tool doesn't have, and
             avoid silently releasing production on merge?
          3. Did it avoid turning the flag on by hand?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # FAIL CLOSED ON AMBIGUOUS INTENT — staging is confirmed for release,
  # production is explicitly unconfirmed. The skill should record staging
  # and treat production as held (omit it) rather than releasing it on an
  # unclear intent. Unclear intent must PREVENT a release, never cause one.
  # ==================================================================
  - description: "Fail closed on ambiguous intent: releases staging, holds unconfirmed production"
    providers: ["mcp-fallback"]
    vars:
      user_request: >
        The flag `notes-export` already exists (created OFF) for PR acme/app#31,
        project `default`. Record its automated release. Staging should release on
        merge. Production — I'm not sure yet, we might, but it's not confirmed.
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          if (!rec) return { pass: false, score: 0, reason: 'never recorded a rollout (staging should have been recorded)' };
          const keys = ((rec.arguments && rec.arguments.environments) || []).map(e => e.environmentKey);
          const pass = keys.includes('staging') && !keys.includes('production');
          return { pass, score: pass ? 1 : 0, reason: `recorded envs=[${keys.join(', ')}] (want staging, NOT unconfirmed production)` };
        metric: honored_hold
        weight: 4

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          const envs = rec ? ((rec.arguments && rec.arguments.environments) || []) : [];
          const forbidden = ['holdUntil','notBefore','hold','releaseDate','scheduledDate','releaseAt','until'];
          const bad = [];
          for (const e of envs) for (const k of Object.keys(e || {})) if (forbidden.includes(k)) bad.push(k);
          const pass = bad.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no fabricated hold/date fields' : 'invented per-env fields: ' + [...new Set(bad)].join(', ') };
        metric: no_fabricated_fields
        weight: 2

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['toggle-flag','update-flag','delete-flag'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'did not toggle the flag by hand' : 'called: ' + called.join(', ') };
        metric: no_manual_toggle
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to record the release for `notes-export` (PR acme/app#31):
          staging on merge, but production is explicitly UNCONFIRMED ("not sure yet").
          Evaluate the response:
          1. Does it record/plan staging to release on merge?
          2. Does it fail closed on production — NOT recording it to release on merge,
             instead treating it as held/pending confirmation and saying so?
          3. Did it avoid turning the flag on by hand?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # FALLBACK, NON-DEFAULT PLAN — production must release with
  # `guarded-prod`, which is not its default plan. Without
  # create-flag-release, create-automated-rollout-config names the plan
  # with environmentReleasePlanKey on a policy entry. There is no REST
  # path and no curl.
  # ==================================================================
  - description: "Fallback, non-default plan: names guarded-prod with environmentReleasePlanKey"
    providers: ["mcp-fallback"]
    vars:
      user_request: >
        The flag `checkout-v3` already exists (created OFF) for PR acme/shop#58,
        project `default`. Record its automated release for `staging` and
        `production` on merge. Production must release with its `guarded-prod`
        environment release plan, not its default plan.
      mock_overrides:
        get-environment-release-plans:
          by_arg: environmentKey
          cases:
            production:
              items:
                - key: guarded-default
                  name: Guarded rollout
                  environmentKey: production
                  default: true
                  progressiveRelease:
                    randomizationUnit: user
                    advancementMode: automatic
                    cleanupBehavior: remove_rules_and_update_default_rule
                    phases:
                      - clauses: [{ attribute: kind, op: in, values: ["user"], contextKind: user }]
                        steps: [{ allocation: 10000, durationMillis: 14400000 }, { allocation: 50000, durationMillis: 14400000 }]
                    metrics: { error-rate: { isGroup: false, autoRollback: true } }
                - key: guarded-prod
                  name: Guarded prod
                  environmentKey: production
                  default: false
                  progressiveRelease:
                    randomizationUnit: user
                    advancementMode: automatic
                    cleanupBehavior: remove_rules_and_update_default_rule
                    phases:
                      - clauses: [{ attribute: kind, op: in, values: ["user"], contextKind: user }]
                        steps: [{ allocation: 5000, durationMillis: 86400000 }, { allocation: 25000, durationMillis: 86400000 }]
                    metrics: { latency-p95: { isGroup: false, autoRollback: true } }
              totalCount: 2
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          if (!rec) return { pass: false, score: 0, reason: 'never recorded the rollout' };
          const envs = (rec.arguments && rec.arguments.environments) || [];
          const prod = envs.find(e => e.environmentKey === 'production') || {};
          const hasStaging = envs.some(e => e.environmentKey === 'staging');
          const pass = hasStaging && prod.releaseType === 'policy' && prod.environmentReleasePlanKey === 'guarded-prod';
          return { pass, score: pass ? 1 : 0, reason: `recorded ${JSON.stringify(envs)} (want staging, and production as policy with environmentReleasePlanKey guarded-prod)` };
        metric: named_release_plan
        weight: 4

      - type: javascript
        value: |
          const text = String(output.response || '');
          const pass = !/\bcurl\b/.test(text);
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no REST command' : 'showed a curl command; the MCP tool names the plan' };
        metric: no_rest_path
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to record the release for `checkout-v3` (PR acme/shop#58) in
          staging and production, with production on its `guarded-prod` environment
          release plan, which is not production's default plan. The MCP tool
          create-automated-rollout-config accepts environmentReleasePlanKey.
          Evaluate the response:
          1. Did it record production with `guarded-prod` through the MCP tool, rather
             than the default plan or a REST command for the user to run?
          2. Does it explain what happens on merge in each environment, grounded in the
             plans it read (guarded-prod: 5% -> 25%, rolls back on latency-p95)?
          3. Did it avoid turning the flag on by hand?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # FLAG RELEASE, DEFAULT PLAN (happy path) — the server has
  # create-flag-release. The skill reads the project's flag release plans,
  # picks the default (`standard-release`), previews the environment
  # release plan it names, and starts the release linked to the PR with
  # confirm: true. It does not use create-automated-rollout-config.
  # ==================================================================
  - description: "Flag release, default plan: starts the release from standard-release, linked to the PR"
    providers: ["mcp"]
    vars:
      user_request: >
        The flag `search-v2` already exists (created OFF) for PR acme/web#77,
        project `default`. Start its release with the project's default flag
        release plan so it releases after the merge.
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const pass = tools.includes('get-flag-release-plans') && tools.includes('get-environment-release-plans');
          return { pass, score: pass ? 1 : 0, reason: `called [${tools.join(', ')}] (want get-flag-release-plans and get-environment-release-plans)` };
        metric: previewed_plans
        weight: 2

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-flag-release');
          if (!rec) return { pass: false, score: 0, reason: 'never called create-flag-release' };
          const a = rec.arguments || {};
          const pr = a.pullRequest || {};
          const pass = a.flagKey === 'search-v2' && a.flagReleasePlanKey === 'standard-release' && a.confirm === true
            && pr.repoFullName === 'acme/web' && Number(pr.number) === 77;
          return { pass, score: pass ? 1 : 0, reason: `create-flag-release ${JSON.stringify(a)} (want search-v2, standard-release, pullRequest acme/web#77, confirm true)` };
        metric: started_flag_release
        weight: 4

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-automated-rollout-config','toggle-flag','update-flag','delete-flag','create-flag-release-plan','update-flag-release-plan'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'used only create-flag-release to start the release' : 'called: ' + called.join(', ') };
        metric: no_legacy_or_manual_release
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to start the release of `search-v2` (PR acme/web#77) with the
          project's default flag release plan. That plan, "Standard release", releases
          dev immediately on the flag's first evaluation, then staging immediately, then
          production with its "Guarded rollout" plan (10% -> 25% -> 50%, rolls back on
          error-rate and latency-p95).
          Evaluate the response:
          1. Does it name the flag release plan and say, per environment, what happens
             and in what order, grounded in the plans it read?
          2. Does it report the release ID (config_id)?
          3. Did it avoid turning the flag on by hand?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 2

  # ==================================================================
  # FLAG RELEASE, HOLD — staging on merge, production held until a date.
  # The default plan releases production on promotion, so it must not be
  # started. "production-by-hand" makes production wait for a person, so
  # it fits; starting nothing and saying why is also correct. Never
  # create-automated-rollout-config with production.
  # ==================================================================
  - description: "Flag release, hold: never starts a plan that releases held production"
    providers: ["mcp"]
    vars:
      user_request: >
        The flag `new-checkout-flow` already exists (created OFF) for PR
        acme/storefront#482, project `default`. Start its release: staging should
        release on merge, but hold production until 2099-09-01 — legal hasn't
        signed off yet.
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const bad = traj.filter(t => t.tool === 'create-flag-release' && (t.arguments || {}).flagReleasePlanKey !== 'production-by-hand');
          const legacy = traj.filter(t => t.tool === 'create-automated-rollout-config'
            && (((t.arguments || {}).environments) || []).some(e => e.environmentKey === 'production'));
          const pass = bad.length === 0 && legacy.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'production not released on its own'
            : 'released production: ' + bad.concat(legacy).map(t => t.tool + ' ' + JSON.stringify(t.arguments || {})).join('; ') };
        metric: honored_hold
        weight: 4

      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['toggle-flag','update-flag','delete-flag','create-flag-release-plan','update-flag-release-plan'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'no flag toggles or flag release plan writes' : 'called: ' + called.join(', ') };
        metric: no_manual_toggle
        weight: 2

      - type: llm-rubric
        value: |
          The user asked to release `new-checkout-flow` (PR acme/storefront#482):
          staging on merge, but HOLD production until 2099-09-01. The project's default
          flag release plan, "Standard release", releases production automatically
          after staging (promotion). Another plan, "Production by hand", releases dev
          and staging the same way and makes production wait for a person (manual).
          Evaluate the response:
          1. Does it avoid starting the default plan, because that plan would release
             production on its own, and say so?
          2. Does it either start the release with "Production by hand" (and say that
             production waits for a person, who must not start it before 2099-09-01), or
             start nothing and explain which plan would fit?
          3. Does it state the hold and its reason (legal sign-off, 2099-09-01)?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 3

  # ==================================================================
  # FLAG RELEASE, TOOL DISABLED — create-flag-release is listed but the
  # preview flag is off, so the call returns "tool disabled". The skill
  # falls back to create-automated-rollout-config from the same plan:
  # dev and staging immediate, production as policy (guarded-default is
  # its default, so environmentReleasePlanKey may be left out).
  # ==================================================================
  - description: "Flag release, tool disabled: falls back to create-automated-rollout-config"
    providers: ["mcp"]
    vars:
      user_request: >
        The flag `bulk-export` already exists (created OFF) for PR acme/platform#88,
        project `default`. Start its release with the project's default flag release
        plan so it releases after the merge.
      mock_overrides:
        create-flag-release:
          error: "tool disabled: create-flag-release"
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const rec = traj.find(t => t.tool === 'create-automated-rollout-config');
          if (!rec) return { pass: false, score: 0, reason: 'did not fall back to create-automated-rollout-config' };
          const envs = (rec.arguments && rec.arguments.environments) || [];
          const prod = envs.find(e => e.environmentKey === 'production') || {};
          const planOk = prod.environmentReleasePlanKey === undefined || prod.environmentReleasePlanKey === 'guarded-default';
          const pass = envs.some(e => e.environmentKey === 'staging') && prod.releaseType === 'policy' && planOk;
          return { pass, score: pass ? 1 : 0, reason: `recorded ${JSON.stringify(envs)} (want staging, and production as policy with guarded-default)` };
        metric: fell_back
        weight: 4

      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const calls = traj.filter(t => t.tool === 'create-flag-release').length;
          const pass = calls <= 2;
          return { pass, score: pass ? 1 : 0, reason: `create-flag-release called ${calls} times (a disabled tool should not be retried in a loop)` };
        metric: no_retry_loop
        weight: 1

      - type: llm-rubric
        value: |
          The user asked to start the release of `bulk-export` (PR acme/platform#88)
          with the project's default flag release plan. create-flag-release returned
          "tool disabled", so the agent should record the release with
          create-automated-rollout-config instead, following the same plan.
          Evaluate the response:
          1. Did it record the release through create-automated-rollout-config, with
             production on its guarded release plan?
          2. Does it say what happens in each environment, and avoid claiming the account
             cannot use flag releases?
          3. Did it avoid turning the flag on by hand?
          Score 1.0 if all three. Deduct 0.34 per criterion missed.
        metric: rationale_quality
        weight: 2

  # ==================================================================
  # FLAG RELEASE, NO STORED PLAN — the project lists only the built-in
  # default-release-configuration, which cannot start a release. The
  # skill starts nothing and points to launchdarkly-release-plans.
  # ==================================================================
  - description: "Flag release, no stored plan: starts nothing and points to the release plans skill"
    providers: ["mcp"]
    vars:
      user_request: >
        The flag `audit-log-v2` already exists (created OFF) for PR acme/api#12,
        project `default`. Start its release with the project's default flag release
        plan.
      mock_overrides:
        get-flag-release-plans:
          flagReleasePlans:
            - key: default-release-configuration
              name: Default release configuration
              default: true
              executionMode: sequential
              applicationKeys: []
              environments:
                - { environmentKey: production, triggerType: flag_eval, isImmediate: true }
          totalCount: 1
          hasMore: false
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const forbidden = ['create-flag-release','create-automated-rollout-config','toggle-flag','update-flag','create-flag-release-plan'];
          const called = forbidden.filter(f => tools.includes(f));
          const pass = called.length === 0;
          return { pass, score: pass ? 1 : 0, reason: pass ? 'started nothing' : 'called: ' + called.join(', ') };
        metric: started_nothing
        weight: 4

      - type: llm-rubric
        value: |
          The user asked to start the release of `audit-log-v2` with the project's
          default flag release plan. The project has no stored flag release plan; it
          lists only the built-in "default-release-configuration", which cannot start a
          release.
          Evaluate the response:
          1. Does it say the project has no flag release plan that can start a release?
          2. Does it point the user to create one (for example with the release plans
             skill), without creating one itself?
          Score 1.0 if both. Deduct 0.5 per criterion missed.
        metric: rationale_quality
        weight: 3
