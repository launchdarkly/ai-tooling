# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Run with shared defaults:
#   promptfoo eval -c shared/defaults.yaml -c onboarding/promptfooconfig.yaml
#
# Scores the kickoff plus the early decision points of the onboarding skill,
# where the reported UX problems live. Tests 5-7 cover the observability plugin
# request: an SDK too old for plugins, a stack with no plugin, and a vague
# follow-up after onboarding finished. Lean mode (allow_builtins:false) keeps
# runs fast: the agent produces the scripted conversation using the mocked LD
# tools and ask-question instead of running a real install. max_turns is capped
# per test so a run stops after the beats being graded.
#
# Because file tools are off, `codebase_context` states its listing as the
# result of the repository scan. Without that framing the agent has no way to
# see an app and takes the skill's "no runnable app" branch in every fixture,
# which is not the state under test.
description: "Evaluation of the onboarding skill: kickoff and early-decision UX"

prompts:
  - file://../../skills/onboarding/SKILL.md

providers:
  - id: file://../providers/claude-skill-agent-sdk.js
    label: claude-skill-agent-sdk
    config:
      skill_slug: onboarding
      allow_builtins: false
      expose_mcp_tools: true
      expose_ask_question: true
      force_skill_invocation: true

tests:
  # ------------------------------------------------------------------
  # Test 1: Kickoff on a clear app. Short welcome, safety reassurance,
  # no roadmap table, no internal leakage, decisions via the tool.
  # ------------------------------------------------------------------
  - description: "Kickoff (clear app): concise opener, asks via tool, no internal leak"
    vars:
      user_request: "Set up LaunchDarkly in my project."
      codebase_context: >
        Repository scan result (file tools are unavailable this run; treat this as what your scan
        returned): a single-package Node.js + Express app on npm. package.json with express,
        src/index.js as the entrypoint and server start. Git repository on branch main, clean tree.
        No LaunchDarkly SDK dependency, no LaunchDarkly code, no MCP configuration.
      max_turns: 6
      mock_ask_question_answers:
        - ["yes"]
        - ["ld_ui"]
        - ["done"]
    assert:
      - type: javascript
        value: |
          const tools = output.tools_called || [];
          const pass = tools.some(t => String(t).includes('ask-question'));
          return { pass, score: pass ? 1 : 0, reason: 'tools: ' + (tools.join(' -> ') || '(none)') };
        metric: asks_via_tool
        weight: 3
      - type: llm-rubric
        value: |
          Evaluate `kickoff_text` (everything before the first tool call) against the skill's Kickoff and
          Voice and Tone rules. Score 1.0 if ALL hold, deduct ~0.25 each:
          1. Opens with a brief welcome (about two sentences) that says what onboarding will do and that no
             code changes are committed without the user's approval. No "I'll help you" / "Let me" filler.
          2. Plain status-line voice: short sentences, no slogans or metaphors, no em dashes.
          3. Does not ask whether the user has a LaunchDarkly account, and does not print a roadmap table
             of the stages.
          4. Leaks NO internal machinery: no step labels ("Step 0/1/2"), skill or file names, workflow
             jargon ("nested skill", "hand off", "BLOCKING"), or MCP/editor-restart rationale.
          If `kickoff_text` is empty, score 0.
        metric: kickoff_quality
        weight: 3

  # ------------------------------------------------------------------
  # Test 2: Multi-package workspace is always "Unclear" in Step 1: the
  # agent must ask which package to integrate instead of guessing.
  # ------------------------------------------------------------------
  - description: "Monorepo: asks which package (does not guess)"
    vars:
      user_request: "Add LaunchDarkly to my project."
      codebase_context: >
        Repository scan result (file tools are unavailable this run; treat this as what your scan
        returned): a pnpm workspace monorepo. pnpm-workspace.yaml lists packages/web (Next.js app),
        packages/api (Express service) and packages/shared (library, no entrypoint). Git repository
        on branch main, clean tree. No LaunchDarkly SDK dependency and no LaunchDarkly code anywhere.
      max_turns: 5
      mock_ask_question_answers:
        - ["packages/web"]
        - ["yes"]
    assert:
      - type: javascript
        value: |
          const asks = (output.trajectory || []).filter(t => String(t.tool).includes('ask-question'));
          if (!asks.length) return { pass: false, score: 0, reason: 'no ask-question call' };
          const scored = asks.map(a => {
            const opts = (a.arguments && a.arguments.options) || [];
            const text = opts.map(o => (o.label||'')+' '+(o.id||'')).join(' | ').toLowerCase();
            const pkgs = ['web', 'api', 'shared'].filter(p => new RegExp('\\b' + p + '\\b').test(text)).length;
            return { opts: opts.length, pkgs, text };
          });
          const hit = scored.find(s => s.opts >= 2 && s.pkgs >= 2);
          const best = hit || scored[0];
          return {
            pass: Boolean(hit),
            score: hit ? 1 : 0,
            reason: best.opts + ' options; package mentions=' + best.pkgs + ' || ' + best.text.slice(0,160),
          };
        metric: asks_which_package
        weight: 3
      - type: llm-rubric
        value: |
          The project is a multi-package monorepo. Per the skill's Step 1, the agent must NOT guess which
          package to integrate: it should ask the user to choose among the candidate packages. Evaluate
          `kickoff_text` plus the first question: does it surface the ambiguity and ask, rather than
          assuming one package? Score 1.0 if it clearly asks the user to pick; 0 if it picks one and
          proceeds.
        metric: no_guess_on_monorepo
        weight: 2

  # ------------------------------------------------------------------
  # Test 3: MCP is offered only after the first flag works, so nothing
  # on the way to the flag may configure MCP or ask the user about it.
  # ------------------------------------------------------------------
  - description: "MCP: not configured or offered on the way to the first flag"
    vars:
      user_request: "Set up LaunchDarkly in my app."
      codebase_context: >
        Repository scan result (file tools are unavailable this run; treat this as what your scan
        returned): a single-package React app built with Vite on npm, src/main.tsx entrypoint,
        `npm run dev` serves it. Git repository on branch main, clean tree. No LaunchDarkly SDK
        dependency, no LaunchDarkly code, and no MCP configuration in any editor config.
      max_turns: 6
      mock_ask_question_answers:
        - ["yes"]
        - ["ld_ui"]
    assert:
      # The MCP offer is expected at the end of the flow, so only the calls up to
      # the flag's creation are checked: nothing on the way to the flag may
      # configure MCP or raise it with the user.
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const flagIdx = traj.findIndex(t => String(t.tool) === 'create-flag');
          const before = traj.slice(0, flagIdx === -1 ? traj.length : flagIdx);
          const questions = before
            .filter(t => String(t.tool).includes('ask-question'))
            .map(t => JSON.stringify(t.arguments || {}).toLowerCase());
          const asksAboutMcp = questions.some(q => q.includes('mcp'));
          return {
            pass: !asksAboutMcp,
            score: asksAboutMcp ? 0 : 1,
            reason: asksAboutMcp
              ? 'asked about MCP before creating the flag'
              : questions.length + ' question(s) before create-flag@' + flagIdx + ', none about MCP',
          };
        metric: no_mcp_question_before_flag
        weight: 3
      - type: llm-rubric
        value: |
          Evaluate `kickoff_text` and `assistant_turns`. Per the skill, MCP is offered only after the first
          flag works, and MCP internals are never explained to the user during setup. Score 1.0 if the
          agent gets on with scanning and SDK install without mentioning MCP, editor restarts, or MCP
          server configuration to the user. Score 0 if it walks the user through MCP setup or explains MCP
          before the flag is working.
        metric: mcp_deferred
        weight: 2

  # ------------------------------------------------------------------
  # Test 4: Drift. The user tries to skip ahead; the skill requires
  # acknowledge, concrete consequence, then a deliberate choice.
  # ------------------------------------------------------------------
  - description: "Drift: redirects a skip-ahead request with the tradeoff stated"
    vars:
      user_request: "Skip the setup, just give me the code to wrap my checkout button in a flag."
      codebase_context: >
        Repository scan result (file tools are unavailable this run; treat this as what your scan
        returned): a single-package Next.js app in TypeScript on npm, with a checkout page under
        app/checkout/page.tsx. Git repository on branch main, clean tree. No LaunchDarkly SDK
        dependency and no LaunchDarkly code.
      max_turns: 4
      mock_ask_question_answers:
        - ["install the SDK first"]
    assert:
      - type: llm-rubric
        value: |
          The user asked to skip onboarding and be handed flag code. Judge the agent's reply to that
          request: the `assistant_turns` texts together with the prompt and options of the
          `ask-question` calls in `trajectory` (the reply's choice is offered through that tool, so a
          question offering "install the SDK first" versus "give me the code now" counts as the choice).
          Per the skill's Redirecting Drift rules the reply must do three things, in order: acknowledge
          the request in the user's words, name in one sentence the concrete consequence of skipping (for
          example that the flag calls will not run until the SDK is installed), and offer the choice
          between finishing the quick step first or proceeding their way. Score 1.0 when all three are
          present; deduct for silent compliance (dumping code with no tradeoff), rigid refusal, or a
          vague consequence.
        metric: handles_drift
        weight: 2

  # ------------------------------------------------------------------
  # Test 5: Observability on an SDK too old to accept `plugins`. The
  # agent must ask before a major upgrade or package swap, naming the
  # version problem in one line, instead of upgrading silently.
  # ------------------------------------------------------------------
  - description: "Observability: old browser SDK without plugins asks before upgrading"
    vars:
      user_request: >
        Run `npx skills add launchdarkly/ai-tooling --skill onboarding -y` and onboard me to LaunchDarkly

        Also add the LaunchDarkly observability plugin for this stack to that client's `plugins` option,
        reusing its key. For a browser app, that's @launchdarkly/observability and
        @launchdarkly/session-replay with privacySetting "strict".
      codebase_context: >
        Repository scan result (file tools are unavailable this run; treat this as what your scan
        returned): a single-package browser app in TypeScript built with Vite on npm, src/main.ts
        entrypoint. LaunchDarkly is already integrated: package.json depends on
        launchdarkly-js-client-sdk ^2.24.2, and src/main.ts calls LDClient.initialize() with
        import.meta.env.VITE_LAUNCHDARKLY_CLIENT_SIDE_ID, then waitForInitialization(). .env sets
        VITE_LAUNCHDARKLY_CLIENT_SIDE_ID and is gitignored. The installed SDK's LDOptions type has no
        `plugins` option. Git repository on branch main, clean tree. No MCP configuration.
      max_turns: 6
      mock_ask_question_answers:
        - ["Keep the current SDK version"]
        - ["ld_ui"]
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const flagIdx = traj.findIndex(t => String(t.tool) === 'create-flag');
          const upgradeIdx = traj.findIndex(t =>
            String(t.tool).includes('ask-question') &&
            /upgrad|version|major|2\.x|4\.x|js-client-sdk/i.test(JSON.stringify(t.arguments || {})));
          const pass = upgradeIdx !== -1 && (flagIdx === -1 || upgradeIdx < flagIdx);
          return {
            pass,
            score: pass ? 1 : 0,
            reason: 'upgrade question@' + upgradeIdx + ', create-flag@' + flagIdx +
              ' || tools: ' + (traj.map(t => t.tool).join(' -> ') || '(none)'),
          };
        metric: asks_before_upgrade
        weight: 3
      - type: llm-rubric
        value: |
          The project runs launchdarkly-js-client-sdk 2.x, which cannot load plugins, and the user asked
          for the observability and session replay plugins. Judge `assistant_turns` together with the
          prompt and options of the `ask-question` calls in `trajectory`. Score 1.0 if ALL hold, deduct
          ~0.25 each:
          1. The agent names the version problem in about one sentence: the installed SDK is too old for
             plugins, and adding them needs a major upgrade or a move to the newer browser SDK package.
          2. It asks the user before upgrading or swapping the package, and does not claim it already
             upgraded the SDK or already added the plugins.
          3. It does not add a second LaunchDarkly client or ask for a second key for the plugins.
          4. Plain status-line voice, with no step labels, skill or file names, or workflow jargon.
        metric: names_version_problem
        weight: 2

  # ------------------------------------------------------------------
  # Test 6: Observability requested on a stack with no plugin (Java).
  # One line saying it is not available yet, then onboarding continues
  # with flags. No OpenTelemetry or other substitute package.
  # ------------------------------------------------------------------
  - description: "Observability: unsupported stack says so in one line and continues with flags"
    vars:
      user_request: >
        Run `npx skills add launchdarkly/ai-tooling --skill onboarding -y` and onboard me to LaunchDarkly

        Also add the LaunchDarkly observability plugin for this stack to that client's `plugins` option,
        reusing its key. For a browser app, that's @launchdarkly/observability and
        @launchdarkly/session-replay with privacySetting "strict".
      codebase_context: >
        Repository scan result (file tools are unavailable this run; treat this as what your scan
        returned): a single-module Spring Boot 3 service in Java on Maven. pom.xml with
        spring-boot-starter-web, src/main/java/com/example/demo/DemoApplication.java as the entrypoint,
        and a GreetingController serving GET /. Git repository on branch main, clean tree. No
        LaunchDarkly SDK dependency, no LaunchDarkly code, no MCP configuration.
      max_turns: 8
      mock_ask_question_answers:
        - ["yes"]
        - ["ld_ui"]
        - ["done"]
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const text = [
            ...(output.assistant_turns || []),
            output.response || '',
            ...traj.map(t => JSON.stringify(t.arguments || {})),
          ].join('\n');
          const sub = /io\.opentelemetry|opentelemetry-(javaagent|sdk|api|exporter)|micrometer/i.exec(text);
          return {
            pass: !sub,
            score: sub ? 0 : 1,
            reason: sub ? 'mentions substitute package: ' + sub[0] : 'no substitute observability package',
          };
        metric: no_substitute_package
        weight: 3
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const continued = traj.some(t => {
            const tool = String(t.tool);
            if (tool === 'create-flag' || tool === 'get-environments') return true;
            return tool.includes('ask-question') &&
              /key|account|flag|flip/i.test(JSON.stringify(t.arguments || {}));
          });
          return {
            pass: continued,
            score: continued ? 1 : 0,
            reason: 'tools: ' + (traj.map(t => t.tool).join(' -> ') || '(none)'),
          };
        metric: continues_with_flags
        weight: 2
      - type: llm-rubric
        value: |
          The project is a Java server, which has no LaunchDarkly observability plugin, and the user asked
          for the plugin. Judge `assistant_turns` and the `ask-question` calls in `trajectory`. Score 1.0 if
          ALL hold, deduct ~0.25 each:
          1. The agent tells the user, in about one sentence, that the observability plugin is not
             available for this stack yet. It does not dwell on it or apologize at length.
          2. It continues onboarding with the Java server SDK and feature flags instead of stopping.
          3. It does not propose OpenTelemetry, a Java agent, or any other package as a substitute.
          4. It does not claim the plugin was added.
        metric: unsupported_stack_handling
        weight: 3

  # ------------------------------------------------------------------
  # Test 7: Vague follow-up after onboarding finished. The plugin goes
  # on the existing client's `plugins` option with the existing key;
  # no SDK reinstall, no key prompt, no new first flag.
  # ------------------------------------------------------------------
  - description: "Observability: vague follow-up targets the existing client, no reinstall"
    vars:
      user_request: "Can you also add the observability plugin?"
      codebase_context: >
        Repository scan result (file tools are unavailable this run; treat this as what your scan
        returned): a single-package React app built with Vite on npm. LaunchDarkly onboarding already
        finished in this repo: package.json depends on launchdarkly-react-client-sdk ^3.8.0, and
        src/main.tsx wraps the root render in asyncWithLDProvider({ clientSideID:
        import.meta.env.VITE_LAUNCHDARKLY_CLIENT_SIDE_ID, context, timeout: 5 }). .env sets
        VITE_LAUNCHDARKLY_CLIENT_SIDE_ID and is gitignored. src/App.tsx reads the show-test-banner flag
        with useFlags(). The launchdarkly-onboarding branch is checked out with uncommitted changes. No
        MCP configuration.
      max_turns: 4
    assert:
      - type: javascript
        value: |
          const traj = output.trajectory || [];
          const bad = traj.filter(t => {
            const tool = String(t.tool);
            if (tool === 'create-flag' || tool === 'get-environments') return true;
            return tool.includes('ask-question') &&
              /sdk.?key|client.?side.?id|mobile.?key|secret|account|which package/i.test(JSON.stringify(t.arguments || {}));
          });
          return {
            pass: bad.length === 0,
            score: bad.length === 0 ? 1 : 0,
            reason: bad.length
              ? 'restarted setup: ' + bad.map(t => t.tool).join(', ')
              : 'tools: ' + (traj.map(t => t.tool).join(' -> ') || '(none)'),
          };
        metric: no_setup_restart
        weight: 3
      - type: llm-rubric
        value: |
          LaunchDarkly is already initialized with asyncWithLDProvider in src/main.tsx, and the user asks
          for the observability plugin as a short follow-up. Judge `assistant_turns` and any `ask-question`
          calls in `trajectory`. Score 1.0 if ALL hold, deduct ~0.25 each:
          1. The agent targets the existing client: it adds @launchdarkly/observability to the `plugins`
             list in the existing provider's options in src/main.tsx (session replay, if added, goes with
             privacySetting "strict").
          2. It reuses the existing client-side ID. It adds no new env var, no second key, and no second
             LaunchDarkly client.
          3. It does not restart onboarding: no SDK reinstall, no stack re-detection walkthrough, no new
             first flag or banner.
          4. Its reply is short and plain, with no step labels, skill or file names, or workflow jargon.
        metric: targets_existing_client
        weight: 3
